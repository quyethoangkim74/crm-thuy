<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VNPT - CRM Bán Hàng & Quản Lý Giao Dịch</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f3f4f6; -webkit-tap-highlight-color: transparent; }
    .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  </style>
</head>
<body class="text-slate-800 antialiased selection:bg-blue-500 selection:text-white pb-16 md:pb-0">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    const SUPABASE_URL = 'https://txcxftivmmgwakcxrnmu.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR4Y3hmdGl2bW1nd2FrY3hybm11Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyODIxNzUsImV4cCI6MjEwMTg1ODE3NX0.nCw8bgYSHE3Q49iGiqK6SuEjcYg5xs22Oa-2-EXqNnw';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const CORRECT_PIN = '1234';

    function App() {
      const [isAuthenticated, setIsAuthenticated] = useState(() => {
        return localStorage.getItem('crm_authenticated') === 'true';
      });
      const [pinInput, setPinInput] = useState('');
      const [pinError, setPinError] = useState('');

      const [activeNav, setActiveNav] = useState('dashboard');
      const [txs, setTxs] = useState([]);
      const [pkgs, setPkgs] = useState([]);
      const [bankLogs, setBankLogs] = useState([]);
      const [loading, setLoading] = useState(false);
      
      const [showTxModal, setShowTxModal] = useState(false);
      const [showPkgModal, setShowPkgModal] = useState(false);
      const [showBankModal, setShowBankModal] = useState(false);
      const [showReportModal, setShowReportModal] = useState(false);

      // Sửa state cho Edit
      const [editingTx, setEditingTx] = useState(null);
      const [editingPkg, setEditingPkg] = useState(null);

      const [txForm, setTxForm] = useState({
        type: 'Phát triển mới', service: 'SIM', packageName: '', months: 12, bonusMonths: 0, amount: '', customer: '', phone: '', startDate: new Date().toISOString().split('T')[0]
      });

      const [pkgForm, setPkgForm] = useState({
        name: '', service: 'SIM', months: 12, bonusMonths: 0, price: ''
      });

      const [bankForm, setBankForm] = useState({
        amount: '', bank: 'MB Bank', date: new Date().toISOString().split('T')[0], note: ''
      });

      const barChartRef = useRef(null);
      const doughnutChartRef = useRef(null);
      const barChartInstance = useRef(null);
      const doughnutChartInstance = useRef(null);

      useEffect(() => {
        if (isAuthenticated) {
          loadData();
        }
      }, [isAuthenticated]);

      const loadData = async () => {
        setLoading(true);
        try {
          const { data: txsData } = await supabase.from('transactions').select('*').order('id', { ascending: false });
          if (txsData) setTxs(txsData);

          const { data: pkgsData } = await supabase.from('packages').select('*').order('id', { ascending: false });
          if (pkgsData) setPkgs(pkgsData);

          const { data: bankData } = await supabase.from('bank_logs').select('*').order('id', { ascending: false });
          if (bankData) setBankLogs(bankData);
        } catch (err) {
          console.error("Lỗi tải dữ liệu:", err);
        } finally {
          setLoading(false);
        }
      };

      const handlePinSubmit = (e) => {
        e.preventDefault();
        if (pinInput === CORRECT_PIN) {
          localStorage.setItem('crm_authenticated', 'true');
          setIsAuthenticated(true);
          setPinError('');
        } else {
          setPinError('Mã PIN không đúng. Vui lòng thử lại!');
          setPinInput('');
        }
      };

      const handleLogout = () => {
        localStorage.removeItem('crm_authenticated');
        setIsAuthenticated(false);
      };

      const handleSelectPackage = (e) => {
        const selectedName = e.target.value;
        if (selectedName === 'custom') {
          setTxForm(prev => ({ ...prev, packageName: '' }));
          return;
        }
        const foundPkg = pkgs.find(p => p.name === selectedName);
        if (foundPkg) {
          setTxForm(prev => ({
            ...prev,
            packageName: foundPkg.name,
            service: foundPkg.service || prev.service,
            months: foundPkg.months || 12,
            bonusMonths: foundPkg.bonusMonths || 0,
            amount: foundPkg.price || prev.amount
          }));
        } else {
          setTxForm(prev => ({ ...prev, packageName: selectedName }));
        }
      };

      const stats = useMemo(() => {
        const simTxs = txs.filter(t => t.service === 'SIM');
        const fiberTxs = txs.filter(t => t.service === 'Fiber');
        const renewalTxs = txs.filter(t => t.type === 'Gia hạn');

        const totalRev = txs.reduce((sum, item) => sum + (Number(item.amount) || 0), 0);
        const simRev = simTxs.reduce((sum, item) => sum + (Number(item.amount) || 0), 0);
        const fiberRev = fiberTxs.reduce((sum, item) => sum + (Number(item.amount) || 0), 0);
        const renewalRev = renewalTxs.reduce((sum, item) => sum + (Number(item.amount) || 0), 0);

        const totalBankPaid = bankLogs.reduce((sum, item) => sum + (Number(item.amount) || 0), 0);
        const remaining = totalRev - totalBankPaid;

        return {
          totalRev,
          simCount: simTxs.length,
          simRev,
          fiberCount: fiberTxs.length,
          fiberRev,
          renewalCount: renewalTxs.length,
          renewalRev,
          totalBankPaid,
          remaining: remaining > 0 ? remaining : 0
        };
      }, [txs, bankLogs]);

      const targetRev = 25000000;
      const targetPercent = Math.min(Math.round((stats.totalRev / targetRev) * 100), 100);

      const upcomingExpirations = useMemo(() => {
        const today = new Date();
        return txs.map(t => {
          if (!t.expireDate) return null;
          const exp = new Date(t.expireDate);
          const diffDays = Math.ceil((exp - today) / (1000 * 60 * 60 * 24));
          return { ...t, diffDays };
        }).filter(t => t && t.diffDays >= 0)
          .sort((a, b) => a.diffDays - b.diffDays)
          .slice(0, 4);
      }, [txs]);

      useEffect(() => {
        if (!isAuthenticated) return;

        if (barChartRef.current) {
          if (barChartInstance.current) barChartInstance.current.destroy();
          
          const daysMap = {};
          txs.forEach(t => {
            if (t.startDate) {
              const parts = t.startDate.split('-');
              const dayNum = parseInt(parts[2] || parts[0], 10);
              daysMap[dayNum] = (daysMap[dayNum] || 0) + (Number(t.amount) || 0);
            }
          });

          const labels = ['01', '04', '07', '10', '13', '16', '19', '22', '25', '28', '31'];
          const dataPoints = labels.map(day => ((daysMap[parseInt(day, 10)] || 0) / 1000000));

          const ctx = barChartRef.current.getContext('2d');
          barChartInstance.current = new Chart(ctx, {
            type: 'bar',
            data: {
              labels: labels,
              datasets: [{
                data: dataPoints,
                backgroundColor: '#2563eb',
                borderRadius: 4,
                barThickness: 8
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { display: false } },
              scales: {
                y: { grid: { color: '#f1f5f9' }, ticks: { callback: v => v + 'M', font: { size: 9 } } },
                x: { grid: { display: false }, ticks: { font: { size: 9 } } }
              }
            }
          });
        }

        if (doughnutChartRef.current) {
          if (doughnutChartInstance.current) doughnutChartInstance.current.destroy();
          const ctx = doughnutChartRef.current.getContext('2d');
          doughnutChartInstance.current = new Chart(ctx, {
            type: 'doughnut',
            data: {
              labels: ['SIM mới', 'Fiber mới', 'Gia hạn'],
              datasets: [{
                data: [stats.simRev || 1, stats.fiberRev || 1, stats.renewalRev || 1],
                backgroundColor: ['#2563eb', '#10b981', '#f59e0b'],
                borderWidth: 0
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              cutout: '70%',
              plugins: { legend: { display: false } }
            }
          });
        }
      }, [isAuthenticated, txs, stats]);

      // --- THÊM / SỬA / XÓA GIAO DỊCH ---
      const handleOpenCreateTx = () => {
        setEditingTx(null);
        setTxForm({ type: 'Phát triển mới', service: 'SIM', packageName: '', months: 12, bonusMonths: 0, amount: '', customer: '', phone: '', startDate: new Date().toISOString().split('T')[0] });
        setShowTxModal(true);
      };

      const handleOpenEditTx = (t) => {
        setEditingTx(t);
        setTxForm({
          type: t.type || 'Phát triển mới',
          service: t.service || 'SIM',
          packageName: t.packageName || '',
          months: t.months || 12,
          bonusMonths: t.bonusMonths || 0,
          amount: t.amount || '',
          customer: t.customer || '',
          phone: t.phone || '',
          startDate: t.startDate || new Date().toISOString().split('T')[0]
        });
        setShowTxModal(true);
      };

      const handleSaveTx = async (e) => {
        e.preventDefault();
        const d = new Date(txForm.startDate);
        d.setMonth(d.getMonth() + Number(txForm.months) + Number(txForm.bonusMonths));
        const expireDate = d.toISOString().split('T')[0];

        const payload = {
          startDate: txForm.startDate,
          type: txForm.type,
          service: txForm.service,
          customer: txForm.customer,
          phone: txForm.phone,
          packageName: txForm.packageName,
          months: Number(txForm.months),
          bonusMonths: Number(txForm.bonusMonths),
          amount: Number(txForm.amount),
          expireDate: expireDate
        };

        if (editingTx) {
          const { data, error } = await supabase.from('transactions').update(payload).eq('id', editingTx.id).select();
          if (error) alert('Lỗi sửa giao dịch: ' + error.message);
          else if (data) {
            setTxs(txs.map(item => item.id === editingTx.id ? data[0] : item));
            setShowTxModal(false);
          }
        } else {
          const { data, error } = await supabase.from('transactions').insert([payload]).select();
          if (error) alert('Lỗi tạo giao dịch: ' + error.message);
          else if (data) {
            setTxs([data[0], ...txs]);
            setShowTxModal(false);
          }
        }
      };

      const handleDeleteTx = async (id) => {
        if (!confirm('Bạn có chắc chắn muốn xóa giao dịch này?')) return;
        const { error } = await supabase.from('transactions').delete().eq('id', id);
        if (error) alert('Lỗi xóa giao dịch: ' + error.message);
        else setTxs(txs.filter(t => t.id !== id));
      };

      // --- THÊM / SỬA / XÓA GÓI CƯỚC ---
      const handleOpenCreatePkg = () => {
        setEditingPkg(null);
        setPkgForm({ name: '', service: 'SIM', months: 12, bonusMonths: 0, price: '' });
        setShowPkgModal(true);
      };

      const handleOpenEditPkg = (p) => {
        setEditingPkg(p);
        setPkgForm({
          name: p.name || '',
          service: p.service || 'SIM',
          months: p.months || 12,
          bonusMonths: p.bonusMonths || 0,
          price: p.price || ''
        });
        setShowPkgModal(true);
      };

      const handleSavePkg = async (e) => {
        e.preventDefault();
        const payload = {
          name: pkgForm.name,
          service: pkgForm.service,
          months: Number(pkgForm.months),
          bonusMonths: Number(pkgForm.bonusMonths),
          price: Number(pkgForm.price)
        };

        if (editingPkg) {
          const { data, error } = await supabase.from('packages').update(payload).eq('id', editingPkg.id).select();
          if (error) alert('Lỗi cập nhật gói cước: ' + error.message);
          else if (data) {
            setPkgs(pkgs.map(item => item.id === editingPkg.id ? data[0] : item));
            setShowPkgModal(false);
          }
        } else {
          const { data, error } = await supabase.from('packages').insert([payload]).select();
          if (error) alert('Lỗi tạo gói cước: ' + error.message);
          else if (data) {
            setPkgs([data[0], ...pkgs]);
            setShowPkgModal(false);
          }
        }
      };

      const handleDeletePkg = async (id) => {
        if (!confirm('Bạn có chắc chắn muốn xóa gói cước này?')) return;
        const { error } = await supabase.from('packages').delete().eq('id', id);
        if (error) alert('Lỗi xóa gói cước: ' + error.message);
        else setPkgs(pkgs.filter(p => p.id !== id));
      };

      // --- NỘP TIỀN NGÂN HÀNG ---
      const handleSaveBank = async (e) => {
        e.preventDefault();
        const payload = {
          date: bankForm.date,
          amount: Number(bankForm.amount),
          bank: bankForm.bank,
          note: bankForm.note
        };

        const { data, error } = await supabase.from('bank_logs').insert([payload]).select();
        if (error) {
          alert('Lỗi nộp tiền: ' + error.message);
        } else if (data) {
          setBankLogs([data[0], ...bankLogs]);
          setShowBankModal(false);
          setBankForm({ amount: '', bank: 'MB Bank', date: new Date().toISOString().split('T')[0], note: '' });
        }
      };

      if (!isAuthenticated) {
        return (
          <div className="min-h-screen bg-slate-900 flex items-center justify-center p-4">
            <div className="bg-white rounded-3xl p-6 md:p-8 max-w-sm w-full shadow-2xl space-y-6 text-center">
              <div className="w-16 h-16 bg-blue-600 rounded-2xl flex items-center justify-center text-white text-2xl mx-auto shadow-lg shadow-blue-500/30">
                <i className="fa-solid fa-lock"></i>
              </div>
              <div>
                <h2 className="text-xl font-bold text-slate-900">VNPT CRM</h2>
                <p className="text-xs text-slate-500 mt-1">Nhập mã PIN để truy cập ứng dụng</p>
              </div>

              <form onSubmit={handlePinSubmit} className="space-y-4">
                <input
                  type="password"
                  maxLength="6"
                  placeholder="• • • •"
                  value={pinInput}
                  onChange={(e) => setPinInput(e.target.value)}
                  className="w-full text-center text-2xl font-black tracking-widest py-3 border-2 border-slate-200 rounded-2xl focus:border-blue-600 outline-none transition"
                  autoFocus
                />
                {pinError && <p className="text-xs font-bold text-rose-500">{pinError}</p>}
                <button
                  type="submit"
                  className="w-full py-3.5 bg-blue-600 hover:bg-blue-700 text-white rounded-2xl font-bold text-sm shadow-lg shadow-blue-600/30 transition active:scale-95"
                >
                  XÁC NHẬN MÃ PIN
                </button>
              </form>
            </div>
          </div>
        );
      }

      return (
        <div className="flex flex-col md:flex-row min-h-screen bg-[#f3f4f6]">
          <aside className="hidden md:flex w-64 bg-white border-r border-slate-200 flex-col justify-between p-4 shrink-0 h-screen sticky top-0">
            <div>
              <div className="flex items-center gap-3 px-2 mb-6">
                <div className="w-9 h-9 bg-blue-600 rounded-xl flex items-center justify-center text-white font-black text-sm shadow-md shadow-blue-500/30">
                  <i className="fa-solid fa-paper-plane"></i>
                </div>
                <div>
                  <h1 className="font-bold text-slate-900 text-sm leading-tight">CRM Bán hàng</h1>
                  <p className="text-[10px] text-slate-400 font-medium">VNPT Telecom</p>
                </div>
              </div>

              <nav className="space-y-1">
                <button onClick={() => setActiveNav('dashboard')} className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl font-bold text-xs transition ${activeNav === 'dashboard' ? 'bg-blue-600 text-white shadow-md shadow-blue-600/20' : 'text-slate-600 hover:bg-slate-100'}`}>
                  <i className="fa-solid fa-table-cells-large text-sm"></i> Dashboard
                </button>
                <button onClick={handleOpenCreatePkg} className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl font-bold text-xs text-slate-600 hover:bg-slate-100 transition`}>
                  <i className="fa-solid fa-box text-sm"></i> Tạo Gói Cước
                </button>
              </nav>

              <div className="mt-6 bg-gradient-to-br from-blue-50 to-blue-100/60 p-4 rounded-2xl border border-blue-100 space-y-3">
                <div className="flex justify-between items-center text-xs">
                  <span className="font-bold text-blue-900">Mục tiêu tháng</span>
                </div>
                <div>
                  <div className="text-[10px] text-slate-500">Doanh thu chỉ tiêu</div>
                  <div className="text-base font-black text-blue-900">25.000.000 đ</div>
                  <div className="text-[10px] text-slate-500 mt-1">Đã đạt: <strong>{stats.totalRev.toLocaleString()} đ</strong></div>
                  <div className="w-full bg-slate-200 h-1.5 rounded-full mt-1.5 overflow-hidden">
                    <div className="bg-blue-600 h-full rounded-full transition-all duration-500" style={{width: `${targetPercent}%`}}></div>
                  </div>
                </div>

                <div className="space-y-2 pt-1 border-t border-blue-200/50 text-[11px]">
                  <div>
                    <div className="flex justify-between text-slate-600 mb-0.5"><span>SIM mới</span><span className="font-bold text-slate-800">{stats.simCount} / 50</span></div>
                    <div className="w-full bg-slate-200 h-1 rounded-full"><div className="bg-blue-600 h-full rounded-full" style={{width: `${Math.min((stats.simCount/50)*100, 100)}%`}}></div></div>
                  </div>
                  <div>
                    <div className="flex justify-between text-slate-600 mb-0.5"><span>Fiber mới</span><span className="font-bold text-slate-800">{stats.fiberCount} / 20</span></div>
                    <div className="w-full bg-slate-200 h-1 rounded-full"><div className="bg-blue-600 h-full rounded-full" style={{width: `${Math.min((stats.fiberCount/20)*100, 100)}%`}}></div></div>
                  </div>
                  <div>
                    <div className="flex justify-between text-slate-600 mb-0.5"><span>Gia hạn</span><span className="font-bold text-slate-800">{stats.renewalCount} / 40</span></div>
                    <div className="w-full bg-slate-200 h-1 rounded-full"><div className="bg-blue-600 h-full rounded-full" style={{width: `${Math.min((stats.renewalCount/40)*100, 100)}%`}}></div></div>
                  </div>
                </div>
              </div>
            </div>

            <div className="space-y-2 border-t pt-3">
              <button onClick={handleLogout} className="w-full text-left text-xs font-bold text-rose-600 hover:bg-rose-50 p-2 rounded-xl transition flex items-center gap-2">
                <i className="fa-solid fa-right-from-bracket"></i> Khóa ứng dụng
              </button>
            </div>
          </aside>

          <div className="flex-1 flex flex-col min-w-0">
            <header className="bg-white border-b border-slate-200 px-4 md:px-6 py-3 flex items-center justify-between sticky top-0 z-20">
              <div className="flex items-center gap-3">
                <div className="w-8 h-8 bg-blue-600 rounded-lg flex md:hidden items-center justify-center text-white font-bold text-xs">
                  <i className="fa-solid fa-paper-plane"></i>
                </div>
                <h2 className="text-base md:text-lg font-bold text-slate-800">Dashboard</h2>
              </div>
              <div className="flex items-center gap-2 md:gap-4">
                {loading && <span className="text-[10px] md:text-[11px] font-bold text-blue-600 bg-blue-50 px-2 py-1 rounded-lg"><i className="fa-solid fa-spin fa-spinner"></i></span>}
                <button onClick={handleLogout} className="md:hidden text-rose-600 p-2 text-sm font-bold">
                  <i className="fa-solid fa-right-from-bracket"></i>
                </button>
                <div className="hidden md:flex items-center gap-2 bg-slate-100 px-3 py-1.5 rounded-xl border border-slate-200 text-xs font-bold text-slate-700">
                  <span>Tháng 08/2026</span>
                  <i className="fa-regular fa-calendar text-slate-400"></i>
                </div>
              </div>
            </header>

            <main className="p-3 md:p-6 space-y-4 md:space-y-5 overflow-y-auto custom-scrollbar">
              <div className="grid grid-cols-2 lg:grid-cols-6 gap-2.5 md:gap-3">
                <div className="bg-white p-3 md:p-3.5 rounded-2xl border border-slate-200/80 shadow-sm flex flex-col justify-between">
                  <div className="flex items-center justify-between mb-1">
                    <span className="text-[10px] font-bold text-slate-400">Tổng doanh thu</span>
                    <div className="w-6 h-6 md:w-8 md:h-8 bg-blue-600 text-white rounded-lg md:rounded-xl flex items-center justify-center text-xs md:text-sm"><i className="fa-solid fa-wallet"></i></div>
                  </div>
                  <span className="text-xs md:text-sm font-black text-slate-900 block">{stats.totalRev.toLocaleString()} đ</span>
                  <span className="text-[9px] font-bold text-emerald-600 mt-1"><i className="fa-solid fa-arrow-up"></i> {targetPercent}% chỉ tiêu</span>
                </div>

                <div className="bg-white p-3 md:p-3.5 rounded-2xl border border-slate-200/80 shadow-sm flex flex-col justify-between">
                  <div className="flex items-center justify-between mb-1">
                    <span className="text-[10px] font-bold text-slate-400">SIM mới</span>
                    <div className="w-6 h-6 md:w-8 md:h-8 bg-emerald-500 text-white rounded-lg md:rounded-xl flex items-center justify-center text-xs md:text-sm"><i className="fa-solid fa-sim-card"></i></div>
                  </div>
                  <span className="text-xs md:text-sm font-black text-slate-900 block">{stats.simCount} TB</span>
                  <span className="text-[10px] font-bold text-slate-600 mt-1">{stats.simRev.toLocaleString()} đ</span>
                </div>

                <div className="bg-white p-3 md:p-3.5 rounded-2xl border border-slate-200/80 shadow-sm flex flex-col justify-between">
                  <div className="flex items-center justify-between mb-1">
                    <span className="text-[10px] font-bold text-slate-400">Fiber mới</span>

                  </div>
                  <span className="text-xs md:text-sm font-black text-slate-900 block">{stats.fiberCount} HĐ</span>
                  <span className="text-[10px] font-bold text-slate-600 mt-1">{stats.fiberRev.toLocaleString()} đ</span>
                </div>

                    <div className="w-6 h-6 md:w-8 md:h-8 bg-amber-500 text-white rounded-lg md:rounded-xl flex items-center justify-center text-xs md:text-sm"><i className="fa-solid fa-rotate-right"></i></div>
                  </div>
                  <span className="text-xs md:text-sm font-black text-slate-900 block">{stats.renewalCount} GD</span>
                  <span className="text-[10px] font-bold text-slate-600 mt-1">{stats.renewalRev.toLocaleString()} đ</span>
                </div>

                    <div className="w-6 h-6 md:w-8 md:h-8 bg-teal-600 text-white rounded-lg md:rounded-xl flex items-center justify-center text-xs md:text-sm"><i className="fa-solid fa-building-columns"></i></div>
                  </div>
                  <span className="text-xs md:text-sm font-black text-slate-900 block">{stats.totalBankPaid.toLocaleString()} đ</span>

                </div>

                <div className="bg-white p-3 md:p-3.5 rounded-2xl border border-slate-200/80 shadow-sm flex flex-col justify-between">

                  </div>
                  <span className="text-xs md:text-sm font-black text-rose-600 block">{stats.remaining.toLocaleString()} đ</span>

                </div>
              </div>

              <div className="grid grid-cols-2 md:grid-cols-5 gap-2.5 md:gap-3">

                  <div className="w-8 h-8 bg-white/20 rounded-xl flex items-center justify-center font-bold text-xs shrink-0"><i className="fa-solid fa-plus"></i></div>
                  <div className="text-left overflow-hidden">
                    <div className="font-bold text-xs truncate">Tạo giao dịch</div>
                    <div className="text-[9px] opacity-80 hidden md:block">Lưu dữ liệu</div>
                  </div>
                </button>

                <button onClick={handleOpenCreatePkg} className="bg-indigo-600 active:bg-indigo-700 text-white p-3 rounded-2xl flex items-center gap-2.5 shadow-sm transition">
                  <div className="w-8 h-8 bg-white/20 rounded-xl flex items-center justify-center font-bold text-xs shrink-0"><i className="fa-solid fa-box"></i></div>
                  <div className="text-left overflow-hidden">
                    <div className="font-bold text-xs truncate">Tạo gói cước</div>
                    <div className="text-[9px] opacity-80 hidden md:block">DS gói cước ({pkgs.length})</div>
                  </div>
                </button>

                <button onClick={handleOpenCreateTx} className="bg-emerald-600 active:bg-emerald-700 text-white p-3 rounded-2xl flex items-center gap-2.5 shadow-sm transition">
                  <div className="w-8 h-8 bg-white/20 rounded-xl flex items-center justify-center font-bold text-xs shrink-0"><i className="fa-solid fa-user-plus"></i></div>
                  <div className="text-left overflow-hidden">
                    <div className="font-bold text-xs truncate">Thêm khách</div>
                    <div className="text-[9px] opacity-80 hidden md:block">Cập nhật DS</div>
                  </div>
                </button>

                <button onClick={() => setShowBankModal(true)} className="bg-purple-600 active:bg-purple-700 text-white p-3 rounded-2xl flex items-center gap-2.5 shadow-sm transition">
                  <div className="w-8 h-8 bg-white/20 rounded-xl flex items-center justify-center font-bold text-xs shrink-0"><i className="fa-solid fa-wallet"></i></div>
                  <div className="text-left overflow-hidden">
                    <div className="font-bold text-xs truncate">Nộp tiền NH</div>
                    <div className="text-[9px] opacity-80 hidden md:block">Cập nhật số dư</div>
                  </div>
                </button>

                <button onClick={() => setShowReportModal(true)} className="bg-amber-500 active:bg-amber-600 text-white p-3 rounded-2xl flex items-center gap-2.5 shadow-sm transition col-span-2 md:col-span-1">
                  <div className="w-8 h-8 bg-white/20 rounded-xl flex items-center justify-center font-bold text-xs shrink-0"><i className="fa-solid fa-chart-pie"></i></div>
                  <div className="text-left overflow-hidden">
                    <div className="font-bold text-xs truncate">Báo cáo DT</div>
                    <div className="text-[9px] opacity-80 hidden md:block">Xem tổng hợp</div>
                  </div>
                </button>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-12 gap-3 md:gap-4">
                <div className="md:col-span-5 bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm space-y-3">
                  <h3 className="font-bold text-xs text-slate-800">Doanh thu theo ngày</h3>
                  <div className="h-40 md:h-44 w-full relative"><canvas ref={barChartRef}></canvas></div>
                </div>

                <div className="md:col-span-4 bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm space-y-3">
                  <h3 className="font-bold text-xs text-slate-800">Tỷ lệ dịch vụ</h3>
                  <div className="flex items-center justify-around gap-2">
                    <div className="w-28 h-28 md:w-32 md:h-36 relative flex items-center justify-center shrink-0">
                      <canvas ref={doughnutChartRef}></canvas>
                    </div>
                    <div className="space-y-2 text-[10px]">
                      <div><span className="inline-block w-2 h-2 rounded-full bg-blue-600 mr-1.5"></span><span className="font-bold">SIM:</span> {stats.simRev.toLocaleString()}đ</div>
                      <div><span className="inline-block w-2 h-2 rounded-full bg-emerald-500 mr-1.5"></span><span className="font-bold">Fiber:</span> {stats.fiberRev.toLocaleString()}đ</div>
                      <div><span className="inline-block w-2 h-2 rounded-full bg-amber-500 mr-1.5"></span><span className="font-bold">Gia hạn:</span> {stats.renewalRev.toLocaleString()}đ</div>
                    </div>
                  </div>
                </div>

                <div className="md:col-span-3 bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm space-y-3">
                  <h3 className="font-bold text-xs text-slate-800">Khách sắp đến hạn</h3>
                  <div className="space-y-2 text-xs">
                    {upcomingExpirations.map(item => (
                      <div key={item.id} className="flex items-center justify-between border-b pb-1">
                        <div>
                          <div className="text-[11px] font-bold text-slate-800">{item.customer}</div>
                          <div className="text-[9px] text-slate-400">{item.phone}</div>
                        </div>
                        <span className="text-[9px] font-bold text-rose-500 bg-rose-50 px-2 py-0.5 rounded-md">Còn {item.diffDays} ngày</span>
                      </div>
                    ))}
                  </div>
                </div>
              </div>

              {/* BẢNG DANH SÁCH GÓI CƯỚC MỚI BỔ SUNG */}
              <div className="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm space-y-3">
                <div className="flex justify-between items-center">
                  <h3 className="font-bold text-xs text-slate-800"><i className="fa-solid fa-box text-indigo-600 mr-1.5"></i> Danh sách Gói Cước ({pkgs.length})</h3>
                  <button onClick={handleOpenCreatePkg} className="text-xs font-bold text-indigo-600 hover:text-indigo-800 bg-indigo-50 px-2.5 py-1 rounded-lg">
                    <i className="fa-solid fa-plus mr-1"></i> Tạo Gói
                  </button>
                </div>
                <div className="overflow-x-auto custom-scrollbar">
                  <table className="w-full text-left text-[11px] min-w-[500px]">
                    <thead className="bg-slate-50 text-slate-400 border-b">
                      <tr>
                        <th className="p-2">Tên Gói</th>
                        <th className="p-2">Dịch Vụ</th>
                        <th className="p-2">Chu Kỳ</th>
                        <th className="p-2">Giá Tiền</th>
                        <th className="p-2 text-center">Thao Tác</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100 font-medium">
                      {pkgs.map(p => (
                        <tr key={p.id}>
                          <td className="p-2 font-bold text-indigo-600 whitespace-nowrap">{p.name}</td>
                          <td className="p-2 whitespace-nowrap">{p.service}</td>
                          <td className="p-2 whitespace-nowrap">{p.months} tháng {p.bonusMonths ? `(+${p.bonusMonths}T KM)` : ''}</td>
                          <td className="p-2 font-bold whitespace-nowrap">{(p.price || 0).toLocaleString()} đ</td>
                          <td className="p-2 text-center whitespace-nowrap">
                            <button onClick={() => handleOpenEditPkg(p)} className="p-1 px-2 text-blue-600 hover:bg-blue-50 rounded-md mr-1 font-bold">
                              <i className="fa-solid fa-pen-to-square"></i> Sửa
                            </button>
                            <button onClick={() => handleDeletePkg(p.id)} className="p-1 px-2 text-rose-600 hover:bg-rose-50 rounded-md font-bold">
                              <i className="fa-solid fa-trash"></i> Xóa
                            </button>
                          </td>
                        </tr>
                      ))}
                      {pkgs.length === 0 && (
                        <tr><td colSpan="5" className="p-3 text-center text-slate-400">Chưa có gói cước nào</td></tr>
                      )}
                    </tbody>
                  </table>
                </div>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-12 gap-3 md:gap-4">
                {/* BẢNG GIAO DỊCH CÓ NÚT SỬA XÓA */}
                <div className="md:col-span-8 bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm space-y-3">
                  <div className="flex justify-between items-center">
                    <h3 className="font-bold text-xs text-slate-800">Giao dịch gần đây ({txs.length})</h3>
                    <button onClick={handleOpenCreateTx} className="text-xs font-bold text-blue-600 hover:text-blue-800 bg-blue-50 px-2.5 py-1 rounded-lg">
                      <i className="fa-solid fa-plus mr-1"></i> Thêm GD
                    </button>
                  </div>
                  <div className="overflow-x-auto custom-scrollbar">
                    <table className="w-full text-left text-[11px] min-w-[550px]">
                      <thead className="bg-slate-50 text-slate-400 border-b">
                        <tr>
                          <th className="p-2">Ngày GD</th>
                          <th className="p-2">Khách hàng</th>
                          <th className="p-2">SĐT</th>
                          <th className="p-2">Gói cước</th>
                          <th className="p-2">Số tiền</th>
                          <th className="p-2 text-center">Thao tác</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100 font-medium">
                        {txs.slice(0, 15).map(t => (
                          <tr key={t.id}>
                            <td className="p-2 whitespace-nowrap">{t.startDate}</td>
                            <td className="p-2 font-bold whitespace-nowrap">{t.customer}</td>
                            <td className="p-2 whitespace-nowrap">{t.phone}</td>
                            <td className="p-2 text-blue-600 font-bold whitespace-nowrap">{t.packageName}</td>
                            <td className="p-2 font-black whitespace-nowrap">{(t.amount || 0).toLocaleString()} đ</td>
                            <td className="p-2 text-center whitespace-nowrap">
                              <button onClick={() => handleOpenEditTx(t)} className="p-1 px-2 text-blue-600 hover:bg-blue-50 rounded-md mr-1 font-bold">
                                <i className="fa-solid fa-pen-to-square"></i>
                              </button>
                              <button onClick={() => handleDeleteTx(t.id)} className="p-1 px-2 text-rose-600 hover:bg-rose-50 rounded-md font-bold">
                                <i className="fa-solid fa-trash"></i>
                              </button>
                            </td>
                          </tr>
                        ))}
                        {txs.length === 0 && (
                          <tr><td colSpan="6" className="p-3 text-center text-slate-400">Chưa có giao dịch nào</td></tr>
                        )}
                      </tbody>
                    </table>
                  </div>
                </div>

                <div className="md:col-span-4 bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm space-y-3">
                  <h3 className="font-bold text-xs text-slate-800">Lịch sử nộp tiền NH</h3>
                  <div className="overflow-x-auto custom-scrollbar">
                    <table className="w-full text-left text-[11px]">
                      <thead className="bg-slate-50 text-slate-400 border-b">
                        <tr>
                          <th className="p-2">Ngày</th>
                          <th className="p-2">Số tiền</th>
                          <th className="p-2">Ngân hàng</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100 font-medium">
                        {bankLogs.map(item => (
                          <tr key={item.id}>
                            <td className="p-2 whitespace-nowrap">{item.date}</td>
                            <td className="p-2 font-bold text-emerald-600 whitespace-nowrap">{item.amount.toLocaleString()} đ</td>
                            <td className="p-2 text-slate-700 font-bold whitespace-nowrap">{item.bank}</td>
                          </tr>
                        ))}
                        {bankLogs.length === 0 && (
                          <tr><td colSpan="3" className="p-3 text-center text-slate-400">Chưa nộp lần nào</td></tr>
                        )}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            </main>
          </div>

          <div className="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 flex justify-around py-2 px-3 z-30 shadow-lg">
            <button onClick={() => setActiveNav('dashboard')} className={`flex flex-col items-center gap-1 ${activeNav === 'dashboard' ? 'text-blue-600' : 'text-slate-400'}`}>
              <i className="fa-solid fa-table-cells-large text-base"></i>
              <span className="text-[10px] font-bold">Tổng quan</span>
            </button>
            <button onClick={handleOpenCreateTx} className="flex flex-col items-center gap-1 text-slate-400">
              <i className="fa-solid fa-circle-plus text-base text-blue-600"></i>
              <span className="text-[10px] font-bold text-slate-700">Tạo GD</span>
            </button>
            <button onClick={handleOpenCreatePkg} className="flex flex-col items-center gap-1 text-slate-400">
              <i className="fa-solid fa-box text-base text-indigo-600"></i>
              <span className="text-[10px] font-bold text-slate-700">Tạo Gói</span>
            </button>
            <button onClick={() => setShowReportModal(true)} className="flex flex-col items-center gap-1 text-slate-400">
              <i className="fa-solid fa-chart-pie text-base"></i>
              <span className="text-[10px] font-bold">Báo cáo</span>
            </button>
          </div>

          {/* MODAL TẠO / SỬA GÓI CƯỚC */}
          {showPkgModal && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-end md:items-center justify-center p-0 md:p-4 z-50">
              <div className="bg-white rounded-t-3xl md:rounded-3xl w-full max-w-md p-5 md:p-6 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">
                <div className="flex justify-between items-center border-b pb-3">
                  <h3 className="text-sm font-black text-slate-900">
                    <i className="fa-solid fa-box text-indigo-600 mr-2"></i>
                    {editingPkg ? 'Sửa Gói Cước' : 'Tạo Gói Cước Mới'}
                  </h3>
                  <button onClick={() => setShowPkgModal(false)} className="text-slate-400 font-bold hover:text-slate-600 text-lg">✕</button>
                </div>
                <form onSubmit={handleSavePkg} className="space-y-3">
                  <div>
                    <label className="text-xs font-bold text-slate-600">Tên Gói Cước</label>
                    <input required type="text" placeholder="VD: FClub, YOLO100" value={pkgForm.name} onChange={e => setPkgForm({...pkgForm, name: e.target.value})} className="w-full mt-1 border rounded-xl p-2.5 text-xs font-bold text-indigo-600" />
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-xs font-bold text-slate-600">Loại Dịch Vụ</label>
                      <select value={pkgForm.service} onChange={e => setPkgForm({...pkgForm, service: e.target.value})} className="w-full mt-1 border rounded-xl p-2.5 text-xs font-bold bg-white">
                        <option value="SIM">SIM Di Động</option>
                        <option value="Fiber">Fiber Internet</option>
                        <option value="MyTV">MyTV</option>
                      </select>
                    </div>
                    <div>
                      <label className="text-xs font-bold text-slate-600">Giá Gói (đ)</label>
                      <input required type="number" placeholder="900000" value={pkgForm.price} onChange={e => setPkgForm({...pkgForm, price: e.target.value})} className="w-full mt-1 border rounded-xl p-2.5 text-xs font-bold" />
                    </div>
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-xs font-bold text-slate-600">Chu Kỳ (Tháng)</label>
                      <input type="number" value={pkgForm.months} onChange={e => setPkgForm({...pkgForm, months: e.target.value})} className="w-full mt-1 border rounded-xl p-2 text-xs" />
                    </div>
                    <div>
                      <label className="text-xs font-bold text-emerald-600">Tháng Khuyến Mãi</label>
                      <input type="number" value={pkgForm.bonusMonths} onChange={e => setPkgForm({...pkgForm, bonusMonths: e.target.value})} className="w-full mt-1 border rounded-xl p-2 text-xs" />
                    </div>
                  </div>
                  <button type="submit" className="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white rounded-xl font-bold shadow-lg text-xs transition">
                    {editingPkg ? 'CẬP NHẬT GÓI CƯỚC' : 'LƯU GÓI CƯỚC VÀO SYSTEM'}
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* MODAL TẠO / SỬA GIAO DỊCH */}
          {showTxModal && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-end md:items-center justify-center p-0 md:p-4 z-50">
              <div className="bg-white rounded-t-3xl md:rounded-3xl w-full max-w-lg p-5 md:p-6 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">
                <div className="flex justify-between items-center border-b pb-3">
                  <h3 className="text-sm font-black text-slate-900">
                    {editingTx ? '✏️ Chỉnh Sửa Giao Dịch' : '➕ Thêm Giao Dịch Mới'}
                  </h3>
                  <button onClick={() => setShowTxModal(false)} className="text-slate-400 font-bold hover:text-slate-600 text-lg">✕</button>
                </div>
                <form onSubmit={handleSaveTx} className="space-y-3">
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-xs font-bold text-slate-600">Loại Dịch Vụ</label>
                      <select value={txForm.service} onChange={e => setTxForm({...txForm, service: e.target.value})} className="w-full mt-1 border rounded-xl p-2.5 text-xs font-bold bg-white">
                        <option value="SIM">SIM Di Động</option>
                        <option value="Fiber">Fiber Internet</option>
                        <option value="MyTV">MyTV</option>
                      </select>
                    </div>
                    <div>
                      <label className="text-xs font-bold text-slate-600">Loại Giao Dịch</label>
                      <select value={txForm.type} onChange={e => setTxForm({...txForm, type: e.target.value})} className="w-full mt-1 border rounded-xl p-2.5 text-xs font-bold bg-white">
                        <option value="Phát triển mới">Phát triển mới</option>
                        <option value="Gia hạn">Gia hạn</option>
                      </select>
                    </div>
                  </div>

                  <div>
                    <div className="flex justify-between items-center">
                      <label className="text-xs font-bold text-slate-600">Chọn Gói Cước Theo Danh Sách</label>
                      <button type="button" onClick={handleOpenCreatePkg} className="text-[10px] font-bold text-indigo-600 hover:underline">+ Tạo gói mới</button>
                    </div>
                    <select onChange={handleSelectPackage} value={txForm.packageName} className="w-full mt-1 border rounded-xl p-2.5 text-xs font-bold text-blue-600 bg-blue-50/50 border-blue-200">
                      <option value="">-- Chọn gói cước có sẵn --</option>
                      {pkgs.map(p => (
                        <option key={p.id} value={p.name}>
                          {p.name} ({p.service}) - {p.price ? p.price.toLocaleString() + 'đ' : ''} [{p.months}T + {p.bonusMonths}T KM]
                        </option>
                      ))}
                      <option value="custom">✍️ Nhập gói cước khác...</option>
                    </select>
                  </div>

                  <div>
                    <label className="text-xs font-bold text-slate-600">Tên Gói Cước Hiển Thị</label>
                    <input required type="text" placeholder="FCLUB_12T" value={txForm.packageName} onChange={e => setTxForm({...txForm, packageName: e.target.value})} className="w-full mt-1 border rounded-xl p-2.5 text-xs font-bold text-blue-600" />
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <div>
                      <label className="text-xs font-bold text-slate-600">Tên Khách Hàng</label>
                      <input required type="text" placeholder="Nguyễn Văn A" value={txForm.customer} onChange={e => setTxForm({...txForm, customer: e.target.value})} className="w-full mt-1 border rounded-xl p-2.5 text-xs" />
                    </div>
                    <div>
                      <label className="text-xs font-bold text-slate-600">Số Điện Thoại</label>
                      <input type="text" placeholder="0911721999" value={txForm.phone} onChange={e => setTxForm({...txForm, phone: e.target.value})} className="w-full mt-1 border rounded-xl p-2.5 text-xs" />
                    </div>
                  </div>

                  <div className="grid grid-cols-3 gap-2">
                    <div>
                      <label className="text-xs font-bold text-slate-600">Chu kỳ (tháng)</label>
                      <input type="number" value={txForm.months} onChange={e => setTxForm({...txForm, months: e.target.value})} className="w-full mt-1 border rounded-xl p-2 text-xs" />
                    </div>
                    <div>
                      <label className="text-xs font-bold text-emerald-600">Tháng KM</label>
                      <input type="number" value={txForm.bonusMonths} onChange={e => setTxForm({...txForm, bonusMonths: e.target.value})} className="w-full mt-1 border rounded-xl p-2 text-xs" />
                    </div>
                    <div>
                      <label className="text-xs font-bold text-slate-600">Số Tiền (đ)</label>
                      <input required type="number" value={txForm.amount} onChange={e => setTxForm({...txForm, amount: e.target.value})} className="w-full mt-1 border rounded-xl p-2 text-xs font-bold" />
                    </div>
                  </div>

                  <button type="submit" className="w-full py-3.5 bg-blue-600 hover:bg-blue-700 active:scale-95 text-white rounded-xl font-bold shadow-lg text-xs mt-2 transition">
                    {editingTx ? 'CẬP NHẬT GIAO DỊCH' : 'LƯU GIAO DỊCH LÊN SUPABASE'}
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* MODAL NỘP TIỀN NGÂN HÀNG */}
          {showBankModal && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-end md:items-center justify-center p-0 md:p-4 z-50">
              <div className="bg-white rounded-t-3xl md:rounded-3xl w-full max-w-md p-5 md:p-6 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">
                <div className="flex justify-between items-center border-b pb-3">
                  <h3 className="text-sm font-black text-slate-900"><i className="fa-solid fa-building-columns text-purple-600 mr-2"></i>Nộp Tiền Ngân Hàng</h3>
                  <button onClick={() => setShowBankModal(false)} className="text-slate-400 font-bold hover:text-slate-600 text-lg">✕</button>
                </div>
                <form onSubmit={handleSaveBank} className="space-y-3">
                  <div>
                    <label className="text-xs font-bold text-slate-600">Số Tiền Nộp (đ)</label>
                    <input required type="number" placeholder="5000000" value={bankForm.amount} onChange={e => setBankForm({...bankForm, amount: e.target.value})} className="w-full mt-1 border rounded-xl p-3 text-sm font-extrabold text-purple-700 outline-none border-purple-200 focus:border-purple-600" />
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-xs font-bold text-slate-600">Ngân Hàng</label>
                      <select value={bankForm.bank} onChange={e => setBankForm({...bankForm, bank: e.target.value})} className="w-full mt-1 border rounded-xl p-2.5 text-xs font-medium bg-white">
                        <option value="MB Bank">MB Bank</option>
                        <option value="Vietcombank">Vietcombank</option>
                        <option value="BIDV">BIDV</option>
                        <option value="Agribank">Agribank</option>
                        <option value="Vietinbank">Vietinbank</option>
                      </select>
                    </div>
                    <div>
                      <label className="text-xs font-bold text-slate-600">Ngày Nộp</label>
                      <input type="date" value={bankForm.date} onChange={e => setBankForm({...bankForm, date: e.target.value})} className="w-full mt-1 border rounded-xl p-2.5 text-xs" />
                    </div>
                  </div>
                  <div>
                    <label className="text-xs font-bold text-slate-600">Ghi Chú</label>
                    <input type="text" placeholder="Nộp doanh thu..." value={bankForm.note} onChange={e => setBankForm({...bankForm, note: e.target.value})} className="w-full mt-1 border rounded-xl p-2.5 text-xs" />
                  </div>
                  <button type="submit" className="w-full py-3.5 bg-purple-600 hover:bg-purple-700 active:scale-95 text-white rounded-xl font-bold shadow-lg text-xs transition">XÁC NHẬN NỘP TIỀN</button>
                </form>
              </div>
            </div>
          )}

          {/* MODAL BÁO CÁO DOANH THU */}
          {showReportModal && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-end md:items-center justify-center p-0 md:p-4 z-50">
              <div className="bg-white rounded-t-3xl md:rounded-3xl w-full max-w-xl p-5 md:p-6 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">
                <div className="flex justify-between items-center border-b pb-3">
                  <h3 className="text-sm font-black text-slate-900"><i className="fa-solid fa-chart-pie text-amber-500 mr-2"></i> Báo Cáo Doanh Thu</h3>
                  <button onClick={() => setShowReportModal(false)} className="text-slate-400 font-bold hover:text-slate-600 text-lg">✕</button>
                </div>
                
                <div className="grid grid-cols-2 gap-3 text-xs">
                  <div className="p-3 bg-slate-50 rounded-xl border">
                    <span className="text-slate-500 block">Tổng doanh thu</span>
                    <span className="text-sm md:text-base font-black text-blue-600">{stats.totalRev.toLocaleString()} đ</span>
                  </div>
                  <div className="p-3 bg-slate-50 rounded-xl border">
                    <span className="text-slate-500 block">Đã nộp ngân hàng</span>
                    <span className="text-sm md:text-base font-black text-emerald-600">{stats.totalBankPaid.toLocaleString()} đ</span>
                  </div>
                </div>

                <div className="space-y-2 text-xs">
                  <div className="font-bold text-slate-700">Chi tiết theo loại dịch vụ:</div>
                  <div className="flex justify-between p-2.5 bg-blue-50/50 rounded-xl border border-blue-100">
                    <span>📱 SIM ({stats.simCount} GD)</span>
                    <span className="font-bold">{stats.simRev.toLocaleString()} đ</span>
                  </div>
                  <div className="flex justify-between p-2.5 bg-emerald-50/50 rounded-xl border border-emerald-100">
                    <span>🌐 Fiber ({stats.fiberCount} GD)</span>
                    <span className="font-bold">{stats.fiberRev.toLocaleString()} đ</span>
                  </div>
                  <div className="flex justify-between p-2.5 bg-amber-50/50 rounded-xl border border-amber-100">
                    <span>🔄 Gia Hạn ({stats.renewalCount} GD)</span>
                    <span className="font-bold">{stats.renewalRev.toLocaleString()} đ</span>
                  </div>
                </div>

                <div className="p-3 bg-rose-50 border border-rose-100 rounded-xl flex justify-between items-center text-xs">
                  <span className="font-bold text-rose-800">Số tiền hiện giữ:</span>
                  <span className="text-sm font-black text-rose-600">{stats.remaining.toLocaleString()} đ</span>
                </div>

                <button onClick={() => setShowReportModal(false)} className="w-full py-3 bg-slate-800 hover:bg-slate-900 active:scale-95 text-white rounded-xl font-bold text-xs">ĐÓNG BÁO CÁO</button>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
