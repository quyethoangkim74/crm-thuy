<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VNPT CRM - Quản Lý Giao Dịch</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- SUPABASE JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-100 font-sans text-slate-800 antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- CẤU HÌNH SUPABASE ĐÃ ĐƯỢC ĐIỀN ĐÚNG THÔNG SỐ CỦA BẠN ---
    const SUPABASE_URL = 'https://txcxftivmmgwakcxrnmu.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR4Y3hmdGl2bW1nd2FrY3hybm11Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyODIxNzUsImV4cCI6MjEwMTg1ODE3NX0.nCw8bgYSHE3Q49iGiqK6SuEjcYg5xs22Oa-2-EXqNnw';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function App() {
      const [isLoggedIn, setIsLoggedIn] = useState(() => localStorage.getItem('vnpt_auth') === 'true');
      const [pin, setPin] = useState('');
      const [activeTab, setActiveTab] = useState('dashboard');
      const [packages, setPackages] = useState([]);
      const [txs, setTxs] = useState([]);
      const [loading, setLoading] = useState(false);

      const [showTxModal, setShowTxModal] = useState(false);
      const [showPkgModal, setShowPkgModal] = useState(false);

      const [txForm, setTxForm] = useState({
        type: 'Phát triển mới', service: 'SIM', packageName: '', months: 12, bonusMonths: 0, amount: '', customer: '', phone: '', startDate: new Date().toISOString().split('T')[0]
      });
      const [pkgForm, setPkgForm] = useState({ name: '', service: 'SIM', price: '', months: 12, bonusMonths: 0 });

      // Load dữ liệu từ Supabase khi mở ứng dụng
      useEffect(() => {
        if (isLoggedIn) {
          loadData();
        }
      }, [isLoggedIn]);

      const loadData = async () => {
        setLoading(true);
        // Lấy danh sách gói cước từ Supabase
        const { data: pkgsData, error: pkgsErr } = await supabase.from('packages').select('*');
        if (pkgsData) setPackages(pkgsData);

        // Lấy danh sách giao dịch từ Supabase (mới nhất lên đầu)
        const { data: txsData, error: txsErr } = await supabase.from('transactions').select('*').order('id', { ascending: false });
        if (txsData) setTxs(txsData);
        setLoading(false);
      };

      const handleLogin = (e) => {
        e.preventDefault();
        if (pin === '123456') { // PIN MẶC ĐỊNH
          setIsLoggedIn(true);
          localStorage.setItem('vnpt_auth', 'true');
        } else alert('Mật khẩu/PIN không đúng!');
      };

      const handleLogout = () => {
        setIsLoggedIn(false);
        localStorage.removeItem('vnpt_auth');
      };

      const handleSelectPkg = (pkgId) => {
        const p = packages.find(item => item.id === Number(pkgId));
        if (p) {
          setTxForm({ ...txForm, packageName: p.name, service: p.service, amount: p.price, months: p.months, bonusMonths: p.bonusMonths });
        }
      };

      // Thêm Giao dịch mới lên Đám mây Supabase
      const handleSaveTx = async (e) => {
        e.preventDefault();
        const d = new Date(txForm.startDate);
        d.setMonth(d.getMonth() + Number(txForm.months) + Number(txForm.bonusMonths));
        const expireDate = d.toISOString().split('T')[0];

        const payload = {
          startDate: txForm.startDate,
          type: txForm.type,
          service: txForm.service,
          customer: txForm.customer,
          phone: txForm.phone,
          packageName: txForm.packageName,
          months: Number(txForm.months),
          bonusMonths: Number(txForm.bonusMonths),
          amount: Number(txForm.amount),
          expireDate: expireDate
        };

        const { data, error } = await supabase.from('transactions').insert([payload]).select();
        if (error) {
          alert('Lỗi lưu giao dịch: ' + error.message);
        } else if (data) {
          setTxs([data[0], ...txs]);
          setShowTxModal(false);
        }
      };

      // Thêm Gói cước mới lên Đám mây Supabase
      const handleSavePkg = async (e) => {
        e.preventDefault();
        const payload = {
          name: pkgForm.name,
          service: pkgForm.service,
          price: Number(pkgForm.price),
          months: Number(pkgForm.months),
          bonusMonths: Number(pkgForm.bonusMonths)
        };

        const { data, error } = await supabase.from('packages').insert([payload]).select();
        if (error) {
          alert('Lỗi thêm gói cước: ' + error.message);
        } else if (data) {
          setPackages([...packages, data[0]]);
          setShowPkgModal(false);
        }
      };

      // 1. MÀN HÌNH ĐĂNG NHẬP
      if (!isLoggedIn) {
        return (
          <div className="min-h-screen bg-slate-900 flex items-center justify-center p-4">
            <div className="bg-white rounded-3xl p-8 max-w-md w-full shadow-2xl text-center">
              <div className="w-16 h-16 bg-blue-600 rounded-2xl flex items-center justify-center text-white text-2xl font-black mx-auto mb-4">VNPT</div>
              <h2 className="text-2xl font-black text-slate-800">CRM Bán Hàng</h2>
              <p className="text-xs text-slate-400 mt-1 mb-6">Đăng nhập để quản lý giao dịch & doanh thu</p>

              <form onSubmit={handleLogin} className="space-y-4">
                <div>
                  <input 
                    type="password" 
                    placeholder="Nhập mã PIN (123456)" 
                    value={pin}
                    onChange={e => setPin(e.target.value)}
                    className="w-full text-center tracking-widest text-lg font-bold border-2 border-slate-200 rounded-2xl p-3 focus:border-blue-600 outline-none"
                  />
                </div>
                <button type="submit" className="w-full py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-2xl shadow-lg transition">
                  ĐĂNG NHẬP
                </button>
              </form>
            </div>
          </div>
        );
      }

      // Tính toán số liệu Dashboard tự động
      const totalRev = txs.reduce((sum, item) => sum + (item.amount || 0), 0);
      const simRev = txs.filter(t => t.service === 'SIM').reduce((sum, item) => sum + (item.amount || 0), 0);
      const fiberRev = txs.filter(t => t.service === 'Fiber').reduce((sum, item) => sum + (item.amount || 0), 0);
      const renewalRev = txs.filter(t => t.type === 'Gia hạn').reduce((sum, item) => sum + (item.amount || 0), 0);

      // 2. MÀN HÌNH DASHBOARD CHÍNH
      return (
        <div className="flex min-h-screen">
          {/* SIDEBAR BÊN TRÁI */}
          <aside className="w-64 bg-white border-r flex flex-col justify-between p-5 fixed h-full z-10">
            <div>
              <div className="flex items-center gap-3 mb-8">
                <div className="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white font-black text-lg shadow-md">VNPT</div>
                <div>
                  <h1 className="font-black text-slate-900 text-base leading-none">CRM Bán hàng</h1>
                  <span className="text-[10px] text-slate-400 font-medium">Quản lý giao dịch</span>
                </div>
              </div>

              <nav className="space-y-1.5">
                <button onClick={() => setActiveTab('dashboard')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold text-sm transition ${activeTab === 'dashboard' ? 'bg-blue-600 text-white shadow-lg shadow-blue-100' : 'text-slate-500 hover:bg-slate-50'}`}>
                  <i className="fa-solid fa-house"></i> Dashboard
                </button>
                <button onClick={() => setActiveTab('txs')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold text-sm transition ${activeTab === 'txs' ? 'bg-blue-600 text-white shadow-lg shadow-blue-100' : 'text-slate-500 hover:bg-slate-50'}`}>
                  <i className="fa-solid fa-receipt"></i> Giao dịch
                </button>
                <button onClick={() => setActiveTab('pkgs')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold text-sm transition ${activeTab === 'pkgs' ? 'bg-blue-600 text-white shadow-lg shadow-blue-100' : 'text-slate-500 hover:bg-slate-50'}`}>
                  <i className="fa-solid fa-box-archive"></i> Gói Cước ({packages.length})
                </button>
              </nav>
            </div>

            <button onClick={handleLogout} className="text-xs font-bold text-rose-500 hover:bg-rose-50 p-3 rounded-xl text-left flex items-center gap-2">
              <i className="fa-solid fa-right-from-bracket"></i> Đăng xuất
            </button>
          </aside>

          {/* MAIN CONTENT */}
          <main className="ml-64 flex-1 p-8">
            <header className="flex justify-between items-center mb-6">
              <h2 className="text-2xl font-black text-slate-900 capitalize">{activeTab}</h2>
              {loading && <span className="text-xs font-bold text-blue-600 animate-pulse"><i className="fa-solid fa-sync fa-spin mr-1"></i> Đang đồng bộ đám mây...</span>}
            </header>

            {/* TAB DASHBOARD */}
            {activeTab === 'dashboard' && (
              <div className="space-y-6">
                <div className="grid grid-cols-4 gap-4">
                  <div className="bg-white p-4 rounded-2xl border shadow-sm flex items-center gap-3">
                    <div className="w-10 h-10 bg-blue-500 text-white rounded-xl flex items-center justify-center"><i className="fa-solid fa-wallet"></i></div>
                    <div>
                      <div className="text-[11px] font-bold text-slate-400">Tổng doanh thu</div>
                      <div className="text-sm font-black text-slate-900 mt-0.5">{totalRev.toLocaleString()} đ</div>
                    </div>
                  </div>

                  <div className="bg-white p-4 rounded-2xl border shadow-sm flex items-center gap-3">
                    <div className="w-10 h-10 bg-emerald-500 text-white rounded-xl flex items-center justify-center"><i className="fa-solid fa-sim-card"></i></div>
                    <div>
                      <div className="text-[11px] font-bold text-slate-400">Doanh thu SIM</div>
                      <div className="text-sm font-black text-slate-900 mt-0.5">{simRev.toLocaleString()} đ</div>
                    </div>
                  </div>

                  <div className="bg-white p-4 rounded-2xl border shadow-sm flex items-center gap-3">
                    <div className="w-10 h-10 bg-purple-500 text-white rounded-xl flex items-center justify-center"><i className="fa-solid fa-wifi"></i></div>
                    <div>
                      <div className="text-[11px] font-bold text-slate-400">Doanh thu Fiber</div>
                      <div className="text-sm font-black text-slate-900 mt-0.5">{fiberRev.toLocaleString()} đ</div>
                    </div>
                  </div>

                  <div className="bg-white p-4 rounded-2xl border shadow-sm flex items-center gap-3">
                    <div className="w-10 h-10 bg-amber-500 text-white rounded-xl flex items-center justify-center"><i className="fa-solid fa-rotate-right"></i></div>
                    <div>
                      <div className="text-[11px] font-bold text-slate-400">Gia hạn</div>
                      <div className="text-sm font-black text-slate-900 mt-0.5">{renewalRev.toLocaleString()} đ</div>
                    </div>
                  </div>
                </div>

                <div className="bg-white rounded-2xl border shadow-sm p-5">
                  <div className="flex justify-between items-center mb-4">
                    <h3 className="font-bold text-slate-800">Lịch sử giao dịch ({txs.length})</h3>
                    <button onClick={() => setShowTxModal(true)} className="bg-blue-600 text-white font-bold px-4 py-2 rounded-xl text-xs flex items-center gap-2 shadow hover:bg-blue-700">
                      <i className="fa-solid fa-plus"></i> Thêm giao dịch
                    </button>
                  </div>

                  <table className="w-full text-left text-xs">
                    <thead className="bg-slate-50 text-slate-400 font-bold border-b">
                      <tr>
                        <th className="p-3">Ngày</th>
                        <th className="p-3">Loại GD</th>
                        <th className="p-3">Loại DV</th>
                        <th className="p-3">Khách hàng</th>
                        <th className="p-3">SĐT</th>
                        <th className="p-3">Gói cước</th>
                        <th className="p-3">Thời hạn</th>
                        <th className="p-3">Số tiền</th>
                        <th className="p-3">Hết hạn</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y font-medium text-slate-700">
                      {txs.map(t => (
                        <tr key={t.id} className="hover:bg-slate-50">
                          <td className="p-3">{t.startDate}</td>
                          <td className="p-3"><span className={`px-2 py-0.5 rounded text-[10px] font-bold ${t.type === 'Gia hạn' ? 'bg-amber-100 text-amber-800' : 'bg-blue-100 text-blue-800'}`}>{t.type}</span></td>
                          <td className="p-3"><span className={`px-2 py-0.5 rounded text-[10px] font-bold ${t.service === 'SIM' ? 'bg-emerald-100 text-emerald-800' : 'bg-purple-100 text-purple-800'}`}>{t.service}</span></td>
                          <td className="p-3 font-bold text-slate-900">{t.customer}</td>
                          <td className="p-3">{t.phone}</td>
                          <td className="p-3 font-bold text-blue-600">{t.packageName}</td>
                          <td className="p-3">{t.months} tháng</td>
                          <td className="p-3 font-black text-slate-900">{(t.amount || 0).toLocaleString()} đ</td>
                          <td className="p-3 font-bold text-rose-600">{t.expireDate}</td>
                        </tr>
                      ))}
                      {txs.length === 0 && (
                        <tr>
                          <td colSpan="9" className="p-8 text-center text-slate-400 font-medium">Chưa có giao dịch nào trên đám mây. Hãy bấm "Thêm giao dịch" để tạo mới!</td>
                        </tr>
                      )}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {/* TAB GÓI CƯỚC */}
            {activeTab === 'pkgs' && (
              <div className="bg-white rounded-2xl border p-5 shadow-sm">
                <div className="flex justify-between items-center mb-6">
                  <h3 className="font-bold text-slate-800">Danh Mục Gói Cước Mẫu</h3>
                  <button onClick={() => setShowPkgModal(true)} className="bg-slate-900 text-white font-bold px-4 py-2 rounded-xl text-xs hover:bg-black">
                    + Thêm gói cước mẫu
                  </button>
                </div>
                <div className="grid grid-cols-4 gap-4">
                  {packages.map(p => (
                    <div key={p.id} className="border p-4 rounded-2xl bg-slate-50">
                      <span className="text-[10px] font-bold bg-blue-100 text-blue-800 px-2 py-0.5 rounded uppercase">{p.service}</span>
                      <div className="font-bold text-base text-slate-900 mt-2">{p.name}</div>
                      <div className="text-blue-600 font-black text-lg my-1">{(p.price || 0).toLocaleString()} đ</div>
                      <div className="text-xs text-slate-500">Chu kỳ: <b>{p.months}T</b> {p.bonusMonths > 0 && <span className="text-emerald-600 font-bold">(+{p.bonusMonths}T KM)</span>}</div>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </main>

          {/* MODAL THÊM GIAO DỊCH */}
          {showTxModal && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-3xl w-full max-w-lg p-6 shadow-2xl">
                <div className="flex justify-between items-center mb-4 border-b pb-2">
                  <h3 className="text-base font-bold text-slate-900">➕ Thêm Giao Dịch Mới</h3>
                  <button onClick={() => setShowTxModal(false)} className="font-bold text-slate-400">✕</button>
                </div>
                <form onSubmit={handleSaveTx} className="space-y-3">
                  <div>
                    <label className="text-xs font-bold text-blue-700">CHỌN GÓI MẪU (TỰ FILL GIÁ & CHU KỲ)</label>
                    <select onChange={e => handleSelectPkg(e.target.value)} className="w-full mt-1 border-2 border-blue-200 rounded-xl p-2.5 text-xs font-bold bg-blue-50">
                      <option value="">-- Chọn gói cước sẵn có --</option>
                      {packages.map(p => (
                        <option key={p.id} value={p.id}>[{p.service}] {p.name} - {(p.price || 0).toLocaleString()}đ ({p.months}T {p.bonusMonths > 0 ? `+ ${p.bonusMonths}T KM` : ''})</option>
                      ))}
                    </select>
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-xs font-bold text-slate-600">Khách hàng</label>
                      <input required type="text" placeholder="Nguyễn Văn A" value={txForm.customer} onChange={e => setTxForm({...txForm, customer: e.target.value})} className="w-full mt-1 border rounded-xl p-2 text-xs" />
                    </div>
                    <div>
                      <label className="text-xs font-bold text-slate-600">Số điện thoại</label>
                      <input type="text" placeholder="091xxx" value={txForm.phone} onChange={e => setTxForm({...txForm, phone: e.target.value})} className="w-full mt-1 border rounded-xl p-2 text-xs" />
                    </div>
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-xs font-bold text-slate-600">Số tiền (đ)</label>
                      <input required type="number" value={txForm.amount} onChange={e => setTxForm({...txForm, amount: e.target.value})} className="w-full mt-1 border rounded-xl p-2 text-xs font-bold text-blue-600" />
                    </div>
                    <div>
                      <label className="text-xs font-bold text-slate-600">Ngày bán</label>
                      <input type="date" value={txForm.startDate} onChange={e => setTxForm({...txForm, startDate: e.target.value})} className="w-full mt-1 border rounded-xl p-2 text-xs" />
                    </div>
                  </div>
                  <button type="submit" className="w-full py-3 bg-blue-600 text-white rounded-xl font-bold hover:bg-blue-700 text-xs mt-2">LƯU TRỰC TIẾP LÊN ĐÁM MÂY</button>
                </form>
              </div>
            </div>
          )}

          {/* MODAL THÊM GÓI CƯỚC */}
          {showPkgModal && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-3xl w-full max-w-md p-6 shadow-2xl">
                <div className="flex justify-between items-center mb-4 border-b pb-2">
                  <h3 className="text-base font-bold text-slate-900">⚙️ Thêm Gói Cước Mới</h3>
                  <button onClick={() => setShowPkgModal(false)} className="font-bold text-slate-400">✕</button>
                </div>
                <form onSubmit={handleSavePkg} className="space-y-3">
                  <div>
                    <label className="text-xs font-bold text-slate-600">Dịch vụ</label>
                    <select value={pkgForm.service} onChange={e => setPkgForm({...pkgForm, service: e.target.value})} className="w-full mt-1 border rounded-xl p-2 text-xs">
                      <option value="SIM">SIM</option>
                      <option value="Fiber">Fiber (Internet)</option>
                    </select>
                  </div>
                  <div>
                    <label className="text-xs font-bold text-slate-600">Tên gói cước</label>
                    <input required type="text" placeholder="FClub 12T" value={pkgForm.name} onChange={e => setPkgForm({...pkgForm, name: e.target.value})} className="w-full mt-1 border rounded-xl p-2 text-xs" />
                  </div>
                  <div className="grid grid-cols-3 gap-2">
                    <div>
                      <label className="text-xs font-bold text-slate-600">Tháng mua</label>
                      <input type="number" value={pkgForm.months} onChange={e => setPkgForm({...pkgForm, months: e.target.value})} className="w-full mt-1 border rounded-xl p-2 text-xs" />
                    </div>
                    <div>
                      <label className="text-xs font-bold text-emerald-600">Tháng KM</label>
                      <input type="number" value={pkgForm.bonusMonths} onChange={e => setPkgForm({...pkgForm, bonusMonths: e.target.value})} className="w-full mt-1 border rounded-xl p-2 text-xs" />
                    </div>
                    <div>
                      <label className="text-xs font-bold text-slate-600">Giá tiền (đ)</label>
                      <input required type="number" placeholder="1800000" value={pkgForm.price} onChange={e => setPkgForm({...pkgForm, price: e.target.value})} className="w-full mt-1 border rounded-xl p-2 text-xs" />
                    </div>
                  </div>
                  <button type="submit" className="w-full py-2.5 bg-slate-900 text-white rounded-xl font-bold mt-2 text-xs">LƯU GÓI CƯỚC MẪU</button>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
