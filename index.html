<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VNPT - CRM Bán Hàng & Quản Lý Giao Dịch</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Thư viện xuất file Excel -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f3f4f6; -webkit-tap-highlight-color: transparent; }
    .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  </style>
</head>
<body class="text-slate-800 antialiased selection:bg-blue-500 selection:text-white pb-16 md:pb-0">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    const SUPABASE_URL = 'https://txcxftivmmgwakcxrnmu.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR4Y3hmdGl2bW1nd2FrY3hybm11Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyODIxNzUsImV4cCI6MjEwMTg1ODE3NX0.nCw8bgYSHE3Q49iGiqK6SuEjcYg5xs22Oa-2-EXqNnw';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const CORRECT_PIN = '1234';

    const formatCurrencyInput = (value) => {
      if (value === null || value === undefined || value === '') return '';
      const rawValue = value.toString().replace(/\D/g, '');
      return rawValue ? new Intl.NumberFormat('vi-VN').format(rawValue) : '';
    };

    const parseCurrencyInput = (value) => {
      if (!value) return 0;
      return Number(value.toString().replace(/\D/g, ''));
    };

    function App() {
      const [isAuthenticated, setIsAuthenticated] = useState(() => {
        return localStorage.getItem('crm_authenticated') === 'true';
      });
      const [pinInput, setPinInput] = useState('');
      const [pinError, setPinError] = useState('');

      const [selectedMonth, setSelectedMonth] = useState(() => {
        const now = new Date();
        const m = String(now.getMonth() + 1).padStart(2, '0');
        return `${now.getFullYear()}-${m}`;
      });

      const [activeTab, setActiveTab] = useState('dashboard');
      const [searchQuery, setSearchQuery] = useState('');

      const [txs, setTxs] = useState([]);
      const [pkgs, setPkgs] = useState([]);
      const [bankLogs, setBankLogs] = useState([]);
      const [loading, setLoading] = useState(false);
      
      const [showTxModal, setShowTxModal] = useState(false);
      const [showPkgModal, setShowPkgModal] = useState(false);
      const [showBankModal, setShowBankModal] = useState(false);
      const [showReportModal, setShowReportModal] = useState(false);

      const [editingTx, setEditingTx] = useState(null);
      const [editingPkg, setEditingPkg] = useState(null);
      const [editingBank, setEditingBank] = useState(null);

      const [txForm, setTxForm] = useState({
        type: 'Phát triển mới', service: 'SIM', packageName: '', months: 12, bonusMonths: 0, amount: '', customer: '', phone: '', startDate: new Date().toISOString().split('T')[0]
      });

      const [pkgForm, setPkgForm] = useState({
        name: '', service: 'SIM', months: 12, bonusMonths: 0, price: ''
      });

      const [bankForm, setBankForm] = useState({
        amount: '', bank: 'MB Bank', date: new Date().toISOString().split('T')[0], note: ''
      });

      const barChartRef = useRef(null);
      const doughnutChartRef = useRef(null);
      const barChartInstance = useRef(null);
      const doughnutChartInstance = useRef(null);

      useEffect(() => {
        if (isAuthenticated) {
          loadData();
        }
      }, [isAuthenticated]);

      const loadData = async () => {
        setLoading(true);
        try {
          const { data: txsData } = await supabase.from('transactions').select('*').order('id', { ascending: false });
          if (txsData) setTxs(txsData);

          const { data: pkgsData } = await supabase.from('packages').select('*').order('id', { ascending: false });
          if (pkgsData) setPkgs(pkgsData);

          const { data: bankData } = await supabase.from('bank_logs').select('*').order('id', { ascending: false });
          if (bankData) setBankLogs(bankData);
        } catch (err) {
          console.error("Lỗi tải dữ liệu:", err);
        } finally {
          setLoading(false);
        }
      };

      const handlePinSubmit = (e) => {
        e.preventDefault();
        if (pinInput === CORRECT_PIN) {
          localStorage.setItem('crm_authenticated', 'true');
          setIsAuthenticated(true);
          setPinError('');
        } else {
          setPinError('Mã PIN không đúng. Vui lòng thử lại!');
          setPinInput('');
        }
      };

      const handleLogout = () => {
        localStorage.removeItem('crm_authenticated');
        setIsAuthenticated(false);
      };

      const handleOpenZaloPC = (phone) => {
        if (!phone) return;
        const cleanPhone = phone.replace(/\D/g, '');
        window.location.href = `zalo://chat?phone=${cleanPhone}`;
        
        const timer = setTimeout(() => {
          window.open(`https://zalo.me/${cleanPhone}`, '_blank');
        }, 1200);

        window.addEventListener('blur', () => clearTimeout(timer), { once: true });
      };

      const filteredTxs = useMemo(() => {
        return txs.filter(t => {
          const matchesMonth = t.startDate && t.startDate.startsWith(selectedMonth);
          const q = searchQuery.toLowerCase().trim();
          const matchesSearch = !q || 
            (t.customer && t.customer.toLowerCase().includes(q)) ||
            (t.phone && t.phone.includes(q)) ||
            (t.packageName && t.packageName.toLowerCase().includes(q));
          return matchesMonth && matchesSearch;
        });
      }, [txs, selectedMonth, searchQuery]);

      const filteredBankLogs = useMemo(() => {
        return bankLogs.filter(b => b.date && b.date.startsWith(selectedMonth));
      }, [bankLogs, selectedMonth]);

      const handleCopyReminder = (item) => {
        const text = `VNPT xin thông báo: Gói cước ${item.packageName || 'dịch vụ'} của Quý khách (${item.customer}) sẽ hết hạn vào ngày ${item.expireDate || 'tới'}. Quý khách vui lòng liên hệ em để gia hạn tiếp tục sử dụng dịch vụ nhé!`;
        navigator.clipboard.writeText(text);
        alert(`Đã sao chép tin nhắn mẫu cho KH ${item.customer}!\n\nNội dung: "${text}"`);
      };

      const handleExportExcel = () => {
        if (filteredTxs.length === 0) {
          alert('Không có dữ liệu giao dịch trong tháng này để xuất Excel!');
          return;
        }

        const dataToExport = filteredTxs.map((t, idx) => ({
          'STT': idx + 1,
          'Ngày GD': t.startDate,
          'Khách Hàng': t.customer,
          'Số Điện Thoại': t.phone,
          'Dịch Vụ': t.service,
          'Loại GD': t.type,
          'Gói Cước': t.packageName,
          'Chu Kỳ (Tháng)': t.months,
          'Tháng KM': t.bonusMonths,
          'Số Tiền (VNĐ)': t.amount,
          'Ngày Hết Hạn': t.expireDate || ''
        }));

        const worksheet = XLSX.utils.json_to_sheet(dataToExport);
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, `GiaoDich_${selectedMonth}`);
        XLSX.writeFile(workbook, `BaoCao_GiaoDich_VNPT_${selectedMonth}.xlsx`);
      };

      const handleSelectPackage = (e) => {
        const selectedName = e.target.value;
        if (selectedName === 'custom') {
          setTxForm(prev => ({ ...prev, packageName: '' }));
          return;
        }
        const foundPkg = pkgs.find(p => p.name === selectedName);
        if (foundPkg) {
          setTxForm(prev => ({
            ...prev,
            packageName: foundPkg.name,
            service: foundPkg.service || prev.service,
            months: foundPkg.months || 12,
            bonusMonths: foundPkg.bonusMonths || 0,
            amount: formatCurrencyInput(foundPkg.price)
          }));
        } else {
          setTxForm(prev => ({ ...prev, packageName: selectedName }));
        }
      };

      const stats = useMemo(() => {
        const currentMonthTxs = txs.filter(t => t.startDate && t.startDate.startsWith(selectedMonth));
        const simTxs = currentMonthTxs.filter(t => t.service === 'SIM');
        const fiberTxs = currentMonthTxs.filter(t => t.service === 'Fiber');
        const renewalTxs = currentMonthTxs.filter(t => t.type === 'Gia hạn');

        const totalRev = currentMonthTxs.reduce((sum, item) => sum + (Number(item.amount) || 0), 0);
        const simRev = simTxs.reduce((sum, item) => sum + (Number(item.amount) || 0), 0);
        const fiberRev = fiberTxs.reduce((sum, item) => sum + (Number(item.amount) || 0), 0);
        const renewalRev = renewalTxs.reduce((sum, item) => sum + (Number(item.amount) || 0), 0);

        const totalBankPaid = filteredBankLogs.reduce((sum, item) => sum + (Number(item.amount) || 0), 0);
        const remaining = totalRev - totalBankPaid;

        return {
          totalRev,
          simCount: simTxs.length,
          simRev,
          fiberCount: fiberTxs.length,
          fiberRev,
          renewalCount: renewalTxs.length,
          renewalRev,
          totalBankPaid,
          remaining: remaining > 0 ? remaining : 0
        };
      }, [txs, filteredBankLogs, selectedMonth]);

      const upcomingExpirations = useMemo(() => {
        const today = new Date();
        return txs.map(t => {
          if (!t.expireDate) return null;
          const exp = new Date(t.expireDate);
          const diffDays = Math.ceil((exp - today) / (1000 * 60 * 60 * 24));
          return { ...t, diffDays };
        }).filter(t => t && t.diffDays >= 0)
          .sort((a, b) => a.diffDays - b.diffDays)
          .slice(0, 4);
      }, [txs]);

      useEffect(() => {
        if (!isAuthenticated || activeTab !== 'dashboard') return;

        if (barChartRef.current) {
          if (barChartInstance.current) barChartInstance.current.destroy();
          
          const daysMap = {};
          const currentMonthTxs = txs.filter(t => t.startDate && t.startDate.startsWith(selectedMonth));
          currentMonthTxs.forEach(t => {
            if (t.startDate) {
              const parts = t.startDate.split('-');
              const dayNum = parseInt(parts[2], 10);
              daysMap[dayNum] = (daysMap[dayNum] || 0) + (Number(t.amount) || 0);
            }
          });

          const labels = ['01', '04', '07', '10', '13', '16', '19', '22', '25', '28', '31'];
          const dataPoints = labels.map(day => ((daysMap[parseInt(day, 10)] || 0) / 1000000));

          const ctx = barChartRef.current.getContext('2d');
          barChartInstance.current = new Chart(ctx, {
            type: 'bar',
            data: {
              labels: labels,
              datasets: [{
                data: dataPoints,
                backgroundColor: '#2563eb',
                borderRadius: 4,
                barThickness: 8
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { display: false } },
              scales: {
                y: { grid: { color: '#f1f5f9' }, ticks: { callback: v => v + 'M', font: { size: 9 } } },
                x: { grid: { display: false }, ticks: { font: { size: 9 } } }
              }
            }
          });
        }

        if (doughnutChartRef.current) {
          if (doughnutChartInstance.current) doughnutChartInstance.current.destroy();
          const ctx = doughnutChartRef.current.getContext('2d');
          doughnutChartInstance.current = new Chart(ctx, {
            type: 'doughnut',
            data: {
              labels: ['SIM mới', 'Fiber mới', 'Gia hạn'],
              datasets: [{
                data: [stats.simRev || 1, stats.fiberRev || 1, stats.renewalRev || 1],
                backgroundColor: ['#2563eb', '#10b981', '#f59e0b'],
                borderWidth: 0
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              cutout: '70%',
              plugins: { legend: { display: false } }
            }
          });
        }
      }, [isAuthenticated, activeTab, txs, selectedMonth, stats]);

      const handleOpenCreateTx = () => {
        setEditingTx(null);
        setTxForm({ type: 'Phát triển mới', service: 'SIM', packageName: '', months: 12, bonusMonths: 0, amount: '', customer: '', phone: '', startDate: new Date().toISOString().split('T')[0] });
        setShowTxModal(true);
      };

      const handleOpenEditTx = (t) => {
        setEditingTx(t);
        setTxForm({
          type: t.type || 'Phát triển mới',
          service: t.service || 'SIM',
          packageName: t.packageName || '',
          months: t.months || 12,
          bonusMonths: t.bonusMonths || 0,
          amount: formatCurrencyInput(t.amount),
          customer: t.customer || '',
          phone: t.phone || '',
          startDate: t.startDate || new Date().toISOString().split('T')[0]
        });
        setShowTxModal(true);
      };

      const handleSaveTx = async (e) => {
        e.preventDefault();
        const d = new Date(txForm.startDate);
        d.setMonth(d.getMonth() + Number(txForm.months) + Number(txForm.bonusMonths));
        const expireDate = d.toISOString().split('T')[0];

        const payload = {
          startDate: txForm.startDate,
          type: txForm.type,
          service: txForm.service,
          customer: txForm.customer,
          phone: txForm.phone,
          packageName: txForm.packageName,
          months: Number(txForm.months),
          bonusMonths: Number(txForm.bonusMonths),
          amount: parseCurrencyInput(txForm.amount),
          expireDate: expireDate
        };

        if (editingTx) {
          const { data, error } = await supabase.from('transactions').update(payload).eq('id', editingTx.id).select();
          if (error) alert('Lỗi sửa giao dịch: ' + error.message);
          else if (data) {
            setTxs(txs.map(item => item.id === editingTx.id ? data[0] : item));
            setShowTxModal(false);
          }
        } else {
          const { data, error } = await supabase.from('transactions').insert([payload]).select();
          if (error) alert('Lỗi tạo giao dịch: ' + error.message);
          else if (data) {
            setTxs([data[0], ...txs]);
            setShowTxModal(false);
          }
        }
      };

      const handleDeleteTx = async (id) => {
        if (!confirm('Bạn có chắc chắn muốn xóa giao dịch này?')) return;
        const { error } = await supabase.from('transactions').delete().eq('id', id);
        if (error) alert('Lỗi xóa giao dịch: ' + error.message);
        else setTxs(txs.filter(t => t.id !== id));
      };

      const handleOpenCreatePkg = () => {
        setEditingPkg(null);
        setPkgForm({ name: '', service: 'SIM', months: 12, bonusMonths: 0, price: '' });
        setShowPkgModal(true);
      };

      const handleOpenEditPkg = (p) => {
        setEditingPkg(p);
        setPkgForm({
          name: p.name || '',
          service: p.service || 'SIM',
          months: p.months || 12,
          bonusMonths: p.bonusMonths || 0,
          price: formatCurrencyInput(p.price)
        });
        setShowPkgModal(true);
      };

      const handleSavePkg = async (e) => {
        e.preventDefault();
        const payload = {
          name: pkgForm.name,
          service: pkgForm.service,
          months: Number(pkgForm.months),
          bonusMonths: Number(pkgForm.bonusMonths),
          price: parseCurrencyInput(pkgForm.price)
        };

        if (editingPkg) {
          const { data, error } = await supabase.from('packages').update(payload).eq('id', editingPkg.id).select();
          if (error) alert('Lỗi cập nhật gói cước: ' + error.message);
          else if (data) {
            setPkgs(pkgs.map(item => item.id === editingPkg.id ? data[0] : item));
            setShowPkgModal(false);
          }
        } else {
          const { data, error } = await supabase.from('packages').insert([payload]).select();
          if (error) alert('Lỗi tạo gói cước: ' + error.message);
          else if (data) {
            setPkgs([data[0], ...pkgs]);
            setShowPkgModal(false);
          }
        }
      };

      const handleDeletePkg = async (id) => {
        if (!confirm('Bạn có chắc chắn muốn xóa gói cước này?')) return;
        const { error } = await supabase.from('packages').delete().eq('id', id);
        if (error) alert('Lỗi xóa gói cước: ' + error.message);
        else setPkgs(pkgs.filter(p => p.id !== id));
      };

      const handleOpenCreateBank = () => {
        setEditingBank(null);
        setBankForm({ amount: '', bank: 'MB Bank', date: new Date().toISOString().split('T')[0], note: '' });
        setShowBankModal(true);
      };

      const handleOpenEditBank = (b) => {
        setEditingBank(b);
        setBankForm({
          amount: formatCurrencyInput(b.amount),
          bank: b.bank || 'MB Bank',
          date: b.date || new Date().toISOString().split('T')[0],
          note: b.note || ''
        });
        setShowBankModal(true);
      };

      const handleSaveBank = async (e) => {
        e.preventDefault();
        const payload = {
          date: bankForm.date,
          amount: parseCurrencyInput(bankForm.amount),
          bank: bankForm.bank,
          note: bankForm.note
        };

        if (editingBank) {
          const { data, error } = await supabase.from('bank_logs').update(payload).eq('id', editingBank.id).select();
          if (error) alert('Lỗi cập nhật nộp tiền: ' + error.message);
          else if (data) {
            setBankLogs(bankLogs.map(item => item.id === editingBank.id ? data[0] : item));
            setShowBankModal(false);
          }
        } else {
          const { data, error } = await supabase.from('bank_logs').insert([payload]).select();
          if (error) alert('Lỗi nộp tiền: ' + error.message);
          else if (data) {
            setBankLogs([data[0], ...bankLogs]);
            setShowBankModal(false);
          }
        }
      };

      const handleDeleteBank = async (id) => {
        if (!confirm('Bạn có chắc chắn muốn xóa lịch sử nộp tiền này?')) return;
        const { error } = await supabase.from('bank_logs').delete().eq('id', id);
        if (error) alert('Lỗi xóa bản ghi: ' + error.message);
        else setBankLogs(bankLogs.filter(b => b.id !== id));
      };

      if (!isAuthenticated) {
        return (
          <div className="min-h-screen bg-slate-900 flex items-center justify-center p-4">
            <div className="bg-white rounded-3xl p-6 md:p-8 max-w-sm w-full shadow-2xl space-y-6 text-center">
              <div className="w-16 h-16 bg-blue-600 rounded-2xl flex items-center justify-center text-white text-2xl mx-auto shadow-lg shadow-blue-500/30">
                <i className="fa-solid fa-lock"></i>
              </div>
              <div>
                <h2 className="text-xl font-bold text-slate-900">VNPT CRM</h2>
                <p className="text-xs text-slate-500 mt-1">Nhập mã PIN để truy cập ứng dụng</p>
              </div>

              <form onSubmit={handlePinSubmit} className="space-y-4">
                <input
                  type="password"
                  maxLength="6"
                  placeholder="• • • •"
                  value={pinInput}
                  onChange={(e) => setPinInput(e.target.value)}
                  className="w-full text-center text-2xl font-black tracking-widest py-3 border-2 border-slate-200 rounded-2xl focus:border-blue-600 outline-none transition"
                  autoFocus
                />
                {pinError && <p className="text-xs font-bold text-rose-500">{pinError}</p>}
                <button
                  type="submit"
                  className="w-full py-3.5 bg-blue-600 hover:bg-blue-700 text-white rounded-2xl font-bold text-sm shadow-lg shadow-blue-600/30 transition active:scale-95"
                >
                  XÁC NHẬN MÃ PIN
                </button>
              </form>
            </div>
          </div>
        );
      }

      return (
        <div className="flex flex-col md:flex-row min-h-screen bg-[#f3f4f6]">
          {/* SIDEBAR BÊN TRÁI */}
          <aside className="hidden md:flex w-64 bg-white border-r border-slate-200 flex-col justify-between p-4 shrink-0 h-screen sticky top-0">
            <div>
              <div className="flex items-center gap-3 px-2 mb-6">
                <div className="w-9 h-9 bg-blue-600 rounded-xl flex items-center justify-center text-white font-black text-sm shadow-md shadow-blue-500/30">
                  <i className="fa-solid fa-paper-plane"></i>
                </div>
                <div>
                  <h1 className="font-bold text-slate-900 text-sm leading-tight">CRM Bán hàng</h1>
                  <p className="text-[10px] text-slate-400 font-medium">VNPT Telecom</p>
                </div>
              </div>

              <nav className="space-y-1.5">
                <button 
                  onClick={() => setActiveTab('dashboard')} 
                  className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl font-bold text-xs transition ${activeTab === 'dashboard' ? 'bg-blue-600 text-white shadow-md shadow-blue-600/20' : 'text-slate-600 hover:bg-slate-100'}`}
                >
                  <i className="fa-solid fa-table-cells-large text-sm"></i> Trang chủ
                </button>

                <button 
                  onClick={() => setActiveTab('packages')} 
                  className={`w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl font-bold text-xs transition ${activeTab === 'packages' ? 'bg-indigo-600 text-white shadow-md shadow-indigo-600/20' : 'text-slate-600 hover:bg-slate-100'}`}
                >
                  <div className="flex items-center gap-3">
                    <i className="fa-solid fa-box text-sm"></i> Danh sách Gói Cước
                  </div>
                  <span className={`text-[10px] px-2 py-0.5 rounded-full ${activeTab === 'packages' ? 'bg-white/20 text-white' : 'bg-slate-200 text-slate-700'}`}>{pkgs.length}</span>
                </button>
              </nav>
            </div>

            <div className="space-y-2 border-t pt-3">
              <button onClick={handleLogout} className="w-full text-left text-xs font-bold text-rose-600 hover:bg-rose-50 p-2.5 rounded-xl transition flex items-center gap-2">
                <i className="fa-solid fa-right-from-bracket"></i> Khóa ứng dụng
              </button>
            </div>
          </aside>

          {/* NỘI DUNG CHÍNH */}
          <div className="flex-1 flex flex-col min-w-0">
            <header className="bg-white border-b border-slate-200 px-4 md:px-6 py-3 flex items-center justify-between sticky top-0 z-20">
              <div className="flex items-center gap-3">
                <div className="w-8 h-8 bg-blue-600 rounded-lg flex md:hidden items-center justify-center text-white font-bold text-xs">
                  <i className="fa-solid fa-paper-plane"></i>
                </div>
                <h2 className="text-base md:text-lg font-bold text-slate-800">
                  {activeTab === 'dashboard' ? 'Trang chủ Dashboard' : 'Quản lý Gói Cước'}
                </h2>
              </div>
              <div className="flex items-center gap-2 md:gap-4">
                {loading && <span className="text-[10px] md:text-[11px] font-bold text-blue-600 bg-blue-50 px-2 py-1 rounded-lg"><i className="fa-solid fa-spin fa-spinner"></i></span>}
                <button onClick={handleLogout} className="md:hidden text-rose-600 p-2 text-sm font-bold">
                  <i className="fa-solid fa-right-from-bracket"></i>
                </button>
                
                {activeTab === 'dashboard' && (
                  <div className="flex items-center gap-2 bg-slate-100 px-3 py-1.5 rounded-xl border border-slate-200 text-xs font-bold text-slate-700">
                    <i className="fa-regular fa-calendar text-blue-600"></i>
                    <input
                      type="month"
                      value={selectedMonth}
                      onChange={(e) => setSelectedMonth(e.target.value)}
                      className="bg-transparent border-none outline-none text-xs font-bold cursor-pointer text-slate-800"
                    />
                  </div>
                )}
              </div>
            </header>

            <main className="p-3 md:p-6 space-y-4 md:space-y-5 overflow-y-auto custom-scrollbar">
              
              {/* TAB 1: TRANG CHỦ (DASHBOARD) */}
              {activeTab === 'dashboard' && (
                <>
                  <div className="grid grid-cols-2 lg:grid-cols-6 gap-2.5 md:gap-3">
                    <div className="bg-white p-3 md:p-3.5 rounded-2xl border border-slate-200/80 shadow-sm flex flex-col justify-between">
                      <div className="flex items-center justify-between mb-1">
                        <span className="text-[10px] font-bold text-slate-400">Tổng doanh thu</span>
                        <div className="w-6 h-6 md:w-8 md:h-8 bg-blue-600 text-white rounded-lg md:rounded-xl flex items-center justify-center text-xs md:text-sm"><i className="fa-solid fa-wallet"></i></div>
                      </div>
                      <span className="text-xs md:text-sm font-black text-slate-900 block">{stats.totalRev.toLocaleString()} đ</span>
                      <span className="text-[9px] font-bold text-blue-600 mt-1">Tháng {selectedMonth}</span>
                    </div>

                    <div className="bg-white p-3 md:p-3.5 rounded-2xl border border-slate-200/80 shadow-sm flex flex-col justify-between">
                      <div className="flex items-center justify-between mb-1">
                        <span className="text-[10px] font-bold text-slate-400">SIM mới</span>
                        <div className="w-6 h-6 md:w-8 md:h-8 bg-emerald-500 text-white rounded-lg md:rounded-xl flex items-center justify-center text-xs md:text-sm"><i className="fa-solid fa-sim-card"></i></div>
                      </div>
                      <span className="text-xs md:text-sm font-black text-slate-900 block">{stats.simCount} TB</span>
                      <span className="text-[10px] font-bold text-slate-600 mt-1">{stats.simRev.toLocaleString()} đ</span>
                    </div>

                    <div className="bg-white p-3 md:p-3.5 rounded-2xl border border-slate-200/80 shadow-sm flex flex-col justify-between">
                      <div className="flex items-center justify-between mb-1">
                        <span className="text-[10px] font-bold text-slate-400">Fiber mới</span>
                        <div className="w-6 h-6 md:w-8 md:h-8 bg-purple-500 text-white rounded-lg md:rounded-xl flex items-center justify-center text-xs md:text-sm"><i className="fa-solid fa-wifi"></i></div>
                      </div>
                      <span className="text-xs md:text-sm font-black text-slate-900 block">{stats.fiberCount} HĐ</span>
                      <span className="text-[10px] font-bold text-slate-600 mt-1">{stats.fiberRev.toLocaleString()} đ</span>
                    </div>

                    <div className="bg-white p-3 md:p-3.5 rounded-2xl border border-slate-200/80 shadow-sm flex flex-col justify-between">
                      <div className="flex items-center justify-between mb-1">
                        <span className="text-[10px] font-bold text-slate-400">Gia hạn</span>
                        <div className="w-6 h-6 md:w-8 md:h-8 bg-amber-500 text-white rounded-lg md:rounded-xl flex items-center justify-center text-xs md:text-sm"><i className="fa-solid fa-rotate-right"></i></div>
                      </div>
                      <span className="text-xs md:text-sm font-black text-slate-900 block">{stats.renewalCount} GD</span>
                      <span className="text-[10px] font-bold text-slate-600 mt-1">{stats.renewalRev.toLocaleString()} đ</span>
                    </div>

                    <div className="bg-white p-3 md:p-3.5 rounded-2xl border border-slate-200/80 shadow-sm flex flex-col justify-between">
                      <div className="flex items-center justify-between mb-1">
                        <span className="text-[10px] font-bold text-slate-400">Đã nộp NH</span>
                        <div className="w-6 h-6 md:w-8 md:h-8 bg-teal-600 text-white rounded-lg md:rounded-xl flex items-center justify-center text-xs md:text-sm"><i className="fa-solid fa-building-columns"></i></div>
                      </div>
                      <span className="text-xs md:text-sm font-black text-slate-900 block">{stats.totalBankPaid.toLocaleString()} đ</span>
                      <span className="text-[9px] text-slate-400 mt-1">{filteredBankLogs.length} lần nộp</span>
                    </div>

                    <div className="bg-white p-3 md:p-3.5 rounded-2xl border border-slate-200/80 shadow-sm flex flex-col justify-between">
                      <div className="flex items-center justify-between mb-1">
                        <span className="text-[10px] font-bold text-slate-400">Chưa nộp</span>
                        <div className="w-6 h-6 md:w-8 md:h-8 bg-rose-500 text-white rounded-lg md:rounded-xl flex items-center justify-center text-xs md:text-sm"><i className="fa-solid fa-money-bill-wave"></i></div>
                      </div>
                      <span className="text-xs md:text-sm font-black text-rose-600 block">{stats.remaining.toLocaleString()} đ</span>
                      <span className="text-[9px] text-slate-400 mt-1">Còn giữ lại</span>
                    </div>
                  </div>

                  <div className="grid grid-cols-2 md:grid-cols-4 gap-2.5 md:gap-3">
                    <button onClick={handleOpenCreateTx} className="bg-blue-600 active:bg-blue-700 text-white p-3 rounded-2xl flex items-center gap-2.5 shadow-sm transition">
                      <div className="w-8 h-8 bg-white/20 rounded-xl flex items-center justify-center font-bold text-xs shrink-0"><i className="fa-solid fa-plus"></i></div>
                      <div className="text-left overflow-hidden">
                        <div className="font-bold text-xs truncate">Tạo giao dịch</div>
                        <div className="text-[9px] opacity-80 hidden md:block">Lưu dữ liệu</div>
                      </div>
                    </button>

                    <button onClick={handleOpenCreateBank} className="bg-teal-600 active:bg-teal-700 text-white p-3 rounded-2xl flex items-center gap-2.5 shadow-sm transition">
                      <div className="w-8 h-8 bg-white/20 rounded-xl flex items-center justify-center font-bold text-xs shrink-0"><i className="fa-solid fa-building-columns"></i></div>
                      <div className="text-left overflow-hidden">
                        <div className="font-bold text-xs truncate">Nộp Ngân hàng</div>
                        <div className="text-[9px] opacity-80 hidden md:block">Ghi nhận dòng tiền</div>
                      </div>
                    </button>

                    <button onClick={handleExportExcel} className="bg-emerald-600 active:bg-emerald-700 text-white p-3 rounded-2xl flex items-center gap-2.5 shadow-sm transition">
                      <div className="w-8 h-8 bg-white/20 rounded-xl flex items-center justify-center font-bold text-xs shrink-0"><i className="fa-solid fa-file-excel"></i></div>
                      <div className="text-left overflow-hidden">
                        <div className="font-bold text-xs truncate">Xuất Excel</div>
                        <div className="text-[9px] opacity-80 hidden md:block">Tải báo cáo tháng</div>
                      </div>
                    </button>

                    <button onClick={() => setShowReportModal(true)} className="bg-slate-800 active:bg-slate-900 text-white p-3 rounded-2xl flex items-center gap-2.5 shadow-sm transition">
                      <div className="w-8 h-8 bg-white/20 rounded-xl flex items-center justify-center font-bold text-xs shrink-0"><i className="fa-solid fa-chart-pie"></i></div>
                      <div className="text-left overflow-hidden">
                        <div className="font-bold text-xs truncate">Báo cáo tổng quan</div>
                        <div className="text-[9px] opacity-80 hidden md:block">Biểu đồ & Phân tích</div>
                      </div>
                    </button>
                  </div>

                  <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
                    {/* DANH SÁCH GIAO DỊCH */}
                    <div className="lg:col-span-2 bg-white rounded-2xl border border-slate-200/80 p-4 shadow-sm space-y-3">
                      <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-2 border-b pb-3">
                        <div className="flex items-center gap-2">
                          <h3 className="font-bold text-slate-800 text-sm">Giao dịch tháng {selectedMonth}</h3>
                          <span className="bg-blue-100 text-blue-700 text-[10px] font-extrabold px-2 py-0.5 rounded-full">{filteredTxs.length}</span>
                        </div>
                        <input
                          type="text"
                          placeholder="Tìm KH, SĐT, Gói..."
                          value={searchQuery}
                          onChange={e => setSearchQuery(e.target.value)}
                          className="w-full sm:w-48 px-3 py-1.5 text-xs border border-slate-200 rounded-xl focus:border-blue-500 outline-none"
                        />
                      </div>

                      <div className="overflow-x-auto custom-scrollbar">
                        <table className="w-full text-left text-xs">
                          <thead>
                            <tr className="bg-slate-50 text-slate-500 border-b border-slate-200">
                              <th className="p-2.5 font-bold">Khách Hàng</th>
                              <th className="p-2.5 font-bold">Gói Cước</th>
                              <th className="p-2.5 font-bold text-right">Số Tiền</th>
                              <th className="p-2.5 font-bold text-center">Thao tác</th>
                            </tr>
                          </thead>
                          <tbody className="divide-y divide-slate-100">
                            {filteredTxs.length === 0 ? (
                              <tr>
                                <td colSpan="4" className="text-center py-6 text-slate-400 font-medium">Chưa có giao dịch nào</td>
                              </tr>
                            ) : (
                              filteredTxs.map(t => (
                                <tr key={t.id} className="hover:bg-slate-50/80 transition">
                                  <td className="p-2.5">
                                    <div className="font-bold text-slate-900">{t.customer || 'Khách lẻ'}</div>
                                    <div className="text-[10px] text-slate-400 flex items-center gap-2">
                                      <span>{t.phone}</span>
                                      {t.phone && (
                                        <button onClick={() => handleOpenZaloPC(t.phone)} className="text-blue-600 hover:underline font-bold">
                                          Zalo
                                        </button>
                                      )}
                                    </div>
                                  </td>
                                  <td className="p-2.5">
                                    <span className="font-bold text-blue-600">{t.packageName}</span>
                                    <div className="text-[10px] text-slate-400">{t.service} • {t.months}+{t.bonusMonths}T</div>
                                  </td>
                                  <td className="p-2.5 text-right font-black text-slate-800">
                                    {Number(t.amount || 0).toLocaleString()} đ
                                  </td>
                                  <td className="p-2.5 text-center">
                                    <div className="flex items-center justify-center gap-1.5">
                                      <button onClick={() => handleCopyReminder(t)} className="text-slate-400 hover:text-blue-600 p-1" title="Nhắn gia hạn">
                                        <i className="fa-regular fa-copy"></i>
                                      </button>
                                      <button onClick={() => handleOpenEditTx(t)} className="text-slate-400 hover:text-amber-600 p-1">
                                        <i className="fa-solid fa-pen-to-square"></i>
                                      </button>
                                      <button onClick={() => handleDeleteTx(t.id)} className="text-slate-400 hover:text-rose-600 p-1">
                                        <i className="fa-solid fa-trash-can"></i>
                                      </button>
                                    </div>
                                  </td>
                                </tr>
                              ))
                            )}
                          </tbody>
                        </table>
                      </div>
                    </div>

                    {/* LỊCH SỬ NỘP NGÂN HÀNG & SẮP HẾT HẠN */}
                    <div className="space-y-4">
                      <div className="bg-white rounded-2xl border border-slate-200/80 p-4 shadow-sm space-y-3">
                        <div className="flex items-center justify-between border-b pb-2">
                          <h3 className="font-bold text-slate-800 text-sm">Sắp hết hạn gia hạn</h3>
                          <i className="fa-solid fa-clock-rotate-left text-amber-500 text-xs"></i>
                        </div>
                        <div className="space-y-2">
                          {upcomingExpirations.length === 0 ? (
                            <p className="text-xs text-slate-400 text-center py-3">Không có gói sắp hết hạn</p>
                          ) : (
                            upcomingExpirations.map(u => (
                              <div key={u.id} className="flex items-center justify-between p-2 rounded-xl bg-slate-50 border border-slate-100 text-xs">
                                <div>
                                  <div className="font-bold text-slate-800">{u.customer} ({u.phone})</div>
                                  <div className="text-[10px] text-slate-500">{u.packageName} • Hạn: {u.expireDate}</div>
                                </div>
                                <button onClick={() => handleCopyReminder(u)} className="bg-amber-500 text-white px-2 py-1 rounded-lg text-[10px] font-bold">
                                  Gửi mẫu
                                </button>
                              </div>
                            ))
                          )}
                        </div>
                      </div>

                      <div className="bg-white rounded-2xl border border-slate-200/80 p-4 shadow-sm space-y-3">
                        <div className="flex items-center justify-between border-b pb-2">
                          <h3 className="font-bold text-slate-800 text-sm">Lịch sử nộp ngân hàng</h3>
                          <button onClick={handleOpenCreateBank} className="text-teal-600 hover:underline text-xs font-bold">+ Thêm</button>
                        </div>
                        <div className="space-y-2 max-h-48 overflow-y-auto custom-scrollbar">
                          {filteredBankLogs.length === 0 ? (
                            <p className="text-xs text-slate-400 text-center py-3">Chưa có lịch sử nộp tiền</p>
                          ) : (
                            filteredBankLogs.map(b => (
                              <div key={b.id} className="flex items-center justify-between p-2 rounded-xl bg-slate-50 border border-slate-100 text-xs">
                                <div>
                                  <div className="font-bold text-teal-700">{Number(b.amount).toLocaleString()} đ</div>
                                  <div className="text-[10px] text-slate-400">{b.date} • {b.bank}</div>
                                </div>
                                <div className="flex items-center gap-1">
                                  <button onClick={() => handleOpenEditBank(b)} className="text-slate-400 hover:text-amber-600 p-1"><i className="fa-solid fa-pen-to-square"></i></button>
                                  <button onClick={() => handleDeleteBank(b.id)} className="text-slate-400 hover:text-rose-600 p-1"><i className="fa-solid fa-trash-can"></i></button>
                                </div>
                              </div>
                            ))
                          )}
                        </div>
                      </div>
                    </div>
                  </div>
                </>
              )}

              {/* TAB 2: QUẢN LÝ GÓI CƯỚC */}
              {activeTab === 'packages' && (
                <div className="bg-white rounded-2xl border border-slate-200/80 p-4 md:p-6 shadow-sm space-y-4">
                  <div className="flex items-center justify-between border-b pb-4">
                    <div>
                      <h3 className="font-bold text-slate-900 text-base">Danh mục Gói Cước mẫu</h3>
                      <p className="text-xs text-slate-500">Quản lý cấu hình các gói cước chuẩn bị sẵn</p>
                    </div>
                    <button onClick={handleOpenCreatePkg} className="bg-indigo-600 text-white px-3.5 py-2 rounded-xl text-xs font-bold shadow-md shadow-indigo-600/20 active:scale-95 transition">
                      + Thêm gói cước
                    </button>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
                    {pkgs.length === 0 ? (
                      <p className="col-span-full text-center py-8 text-slate-400 font-medium text-xs">Chưa có gói cước nào. Nhấn "+ Thêm gói cước" để tạo mới!</p>
                    ) : (
                      pkgs.map(p => (
                        <div key={p.id} className="border border-slate-200 rounded-2xl p-4 space-y-2 relative bg-slate-50/50 hover:bg-white transition">
                          <div className="flex items-center justify-between">
                            <span className={`text-[10px] font-extrabold px-2 py-0.5 rounded-full ${p.service === 'SIM' ? 'bg-blue-100 text-blue-700' : 'bg-purple-100 text-purple-700'}`}>{p.service}</span>
                            <div className="flex items-center gap-1">
                              <button onClick={() => handleOpenEditPkg(p)} className="text-slate-400 hover:text-amber-600 p-1"><i className="fa-solid fa-pen-to-square"></i></button>
                              <button onClick={() => handleDeletePkg(p.id)} className="text-slate-400 hover:text-rose-600 p-1"><i className="fa-solid fa-trash-can"></i></button>
                            </div>
                          </div>
                          <h4 className="font-bold text-slate-900 text-sm">{p.name}</h4>
                          <div className="text-xs font-black text-indigo-600">{Number(p.price).toLocaleString()} đ</div>
                          <div className="text-[11px] text-slate-500">Chu kỳ: {p.months} tháng {p.bonusMonths > 0 ? `(+${p.bonusMonths}T KM)` : ''}</div>
                        </div>
                      ))
                    )}
                  </div>
                </div>
              )}

            </main>
          </div>

          {/* TAB BAR DƯỚI CHO MOBILE */}
          <div className="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 flex items-center justify-around py-2 z-30">
            <button onClick={() => setActiveTab('dashboard')} className={`flex flex-col items-center gap-1 text-[10px] font-bold ${activeTab === 'dashboard' ? 'text-blue-600' : 'text-slate-400'}`}>
              <i className="fa-solid fa-table-cells-large text-base"></i> Trang chủ
            </button>
            <button onClick={() => setActiveTab('packages')} className={`flex flex-col items-center gap-1 text-[10px] font-bold ${activeTab === 'packages' ? 'text-indigo-600' : 'text-slate-400'}`}>
              <i className="fa-solid fa-box text-base"></i> Gói cước
            </button>
          </div>

          {/* MODAL GIAO DỊCH */}
          {showTxModal && (
            <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl p-5 md:p-6 max-w-md w-full shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto custom-scrollbar">
                <div className="flex items-center justify-between border-b pb-3">
                  <h3 className="font-bold text-slate-900 text-sm">{editingTx ? 'Sửa giao dịch' : 'Tạo giao dịch mới'}</h3>
                  <button onClick={() => setShowTxModal(false)} className="text-slate-400 hover:text-slate-600 p-1"><i className="fa-solid fa-xmark"></i></button>
                </div>

                <form onSubmit={handleSaveTx} className="space-y-3 text-xs">
                  <div>
                    <label className="block font-bold text-slate-700 mb-1">Loại giao dịch</label>
                    <select value={txForm.type} onChange={e => setTxForm({...txForm, type: e.target.value})} className="w-full p-2.5 border border-slate-200 rounded-xl outline-none font-medium">
                      <option value="Phát triển mới">Phát triển mới</option>
                      <option value="Gia hạn">Gia hạn</option>
                    </select>
                  </div>

                  <div>
                    <label className="block font-bold text-slate-700 mb-1">Chọn gói cước mẫu</label>
                    <select onChange={handleSelectPackage} className="w-full p-2.5 border border-slate-200 rounded-xl outline-none font-medium">
                      <option value="">-- Chọn gói cước sẵn có --</option>
                      {pkgs.map(p => <option key={p.id} value={p.name}>{p.name} - {Number(p.price).toLocaleString()}đ</option>)}
                      <option value="custom">-- Nhập tùy chỉnh --</option>
                    </select>
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Dịch vụ</label>
                      <select value={txForm.service} onChange={e => setTxForm({...txForm, service: e.target.value})} className="w-full p-2.5 border border-slate-200 rounded-xl outline-none font-medium">
                        <option value="SIM">SIM</option>
                        <option value="Fiber">Fiber (Internet)</option>
                      </select>
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Tên Gói Cước</label>
                      <input type="text" required value={txForm.packageName} onChange={e => setTxForm({...txForm, packageName: e.target.value})} className="w-full p-2.5 border border-slate-200 rounded-xl outline-none font-medium" placeholder="VD: VD149T" />
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Tên Khách Hàng</label>
                      <input type="text" required value={txForm.customer} onChange={e => setTxForm({...txForm, customer: e.target.value})} className="w-full p-2.5 border border-slate-200 rounded-xl outline-none font-medium" placeholder="Nguyễn Văn A" />
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Số điện thoại</label>
                      <input type="text" value={txForm.phone} onChange={e => setTxForm({...txForm, phone: e.target.value})} className="w-full p-2.5 border border-slate-200 rounded-xl outline-none font-medium" placeholder="0912345678" />
                    </div>
                  </div>

                  <div className="grid grid-cols-3 gap-2">
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Chu kỳ (T)</label>
                      <input type="number" value={txForm.months} onChange={e => setTxForm({...txForm, months: e.target.value})} className="w-full p-2.5 border border-slate-200 rounded-xl outline-none font-medium" />
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">KM (T)</label>
                      <input type="number" value={txForm.bonusMonths} onChange={e => setTxForm({...txForm, bonusMonths: e.target.value})} className="w-full p-2.5 border border-slate-200 rounded-xl outline-none font-medium" />
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Số tiền (đ)</label>
                      <input type="text" required value={txForm.amount} onChange={e => setTxForm({...txForm, amount: formatCurrencyInput(e.target.value)})} className="w-full p-2.5 border border-slate-200 rounded-xl outline-none font-bold text-blue-600" placeholder="0" />
                    </div>
                  </div>

                  <div>
                    <label className="block font-bold text-slate-700 mb-1">Ngày bắt đầu</label>
                    <input type="date" value={txForm.startDate} onChange={e => setTxForm({...txForm, startDate: e.target.value})} className="w-full p-2.5 border border-slate-200 rounded-xl outline-none font-medium" />
                  </div>

                  <button type="submit" className="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold shadow-md shadow-blue-600/20 transition">
                    LƯU GIAO DỊCH
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* MODAL GÓI CƯỚC */}
          {showPkgModal && (
            <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl p-5 md:p-6 max-w-sm w-full shadow-2xl space-y-4">
                <div className="flex items-center justify-between border-b pb-3">
                  <h3 className="font-bold text-slate-900 text-sm">{editingPkg ? 'Sửa gói cước' : 'Tạo gói cước mới'}</h3>
                  <button onClick={() => setShowPkgModal(false)} className="text-slate-400 hover:text-slate-600 p-1"><i className="fa-solid fa-xmark"></i></button>
                </div>

                <form onSubmit={handleSavePkg} className="space-y-3 text-xs">
                  <div>
                    <label className="block font-bold text-slate-700 mb-1">Tên gói cước</label>
                    <input type="text" required value={pkgForm.name} onChange={e => setPkgForm({...pkgForm, name: e.target.value})} className="w-full p-2.5 border border-slate-200 rounded-xl outline-none font-medium" placeholder="VD: YEK70" />
                  </div>

                  <div>
                    <label className="block font-bold text-slate-700 mb-1">Loại dịch vụ</label>
                    <select value={pkgForm.service} onChange={e => setPkgForm({...pkgForm, service: e.target.value})} className="w-full p-2.5 border border-slate-200 rounded-xl outline-none font-medium">
                      <option value="SIM">SIM</option>
                      <option value="Fiber">Fiber (Internet)</option>
                    </select>
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Số tháng</label>
                      <input type="number" value={pkgForm.months} onChange={e => setPkgForm({...pkgForm, months: e.target.value})} className="w-full p-2.5 border border-slate-200 rounded-xl outline-none font-medium" />
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Tháng KM</label>
                      <input type="number" value={pkgForm.bonusMonths} onChange={e => setPkgForm({...pkgForm, bonusMonths: e.target.value})} className="w-full p-2.5 border border-slate-200 rounded-xl outline-none font-medium" />
                    </div>
                  </div>

                  <div>
                    <label className="block font-bold text-slate-700 mb-1">Giá bán (đ)</label>
                    <input type="text" required value={pkgForm.price} onChange={e => setPkgForm({...pkgForm, price: formatCurrencyInput(e.target.value)})} className="w-full p-2.5 border border-slate-200 rounded-xl outline-none font-bold text-indigo-600" placeholder="0" />
                  </div>

                  <button type="submit" className="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-bold shadow-md shadow-indigo-600/20 transition">
                    LƯU GÓI CƯỚC
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* MODAL NỘP NGÂN HÀNG */}
          {showBankModal && (
            <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl p-5 md:p-6 max-w-sm w-full shadow-2xl space-y-4">
                <div className="flex items-center justify-between border-b pb-3">
                  <h3 className="font-bold text-slate-900 text-sm">{editingBank ? 'Sửa lịch sử nộp' : 'Tạo nộp ngân hàng'}</h3>
                  <button onClick={() => setShowBankModal(false)} className="text-slate-400 hover:text-slate-600 p-1"><i className="fa-solid fa-xmark"></i></button>
                </div>

                <form onSubmit={handleSaveBank} className="space-y-3 text-xs">
                  <div>
                    <label className="block font-bold text-slate-700 mb-1">Số tiền nộp (đ)</label>
                    <input type="text" required value={bankForm.amount} onChange={e => setBankForm({...bankForm, amount: formatCurrencyInput(e.target.value)})} className="w-full p-2.5 border border-slate-200 rounded-xl outline-none font-bold text-teal-600 text-sm" placeholder="0" />
                  </div>

                  <div>
                    <label className="block font-bold text-slate-700 mb-1">Ngân hàng</label>
                    <input type="text" value={bankForm.bank} onChange={e => setBankForm({...bankForm, bank: e.target.value})} className="w-full p-2.5 border border-slate-200 rounded-xl outline-none font-medium" placeholder="MB Bank, Vietinbank..." />
                  </div>

                  <div>
                    <label className="block font-bold text-slate-700 mb-1">Ngày nộp</label>
                    <input type="date" value={bankForm.date} onChange={e => setBankForm({...bankForm, date: e.target.value})} className="w-full p-2.5 border border-slate-200 rounded-xl outline-none font-medium" />
                  </div>

                  <div>
                    <label className="block font-bold text-slate-700 mb-1">Ghi chú</label>
                    <input type="text" value={bankForm.note} onChange={e => setBankForm({...bankForm, note: e.target.value})} className="w-full p-2.5 border border-slate-200 rounded-xl outline-none font-medium" placeholder="Nộp doanh thu tuần 1..." />
                  </div>

                  <button type="submit" className="w-full py-3 bg-teal-600 hover:bg-teal-700 text-white rounded-xl font-bold shadow-md shadow-teal-600/20 transition">
                    XÁC NHẬN NỘP TIỀN
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* MODAL BÁO CÁO TỔNG QUAN */}
          {showReportModal && (
            <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl p-5 md:p-6 max-w-2xl w-full shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto custom-scrollbar">
                <div className="flex items-center justify-between border-b pb-3">
                  <h3 className="font-bold text-slate-900 text-sm">Báo cáo & Biểu đồ doanh thu - Tháng {selectedMonth}</h3>
                  <button onClick={() => setShowReportModal(false)} className="text-slate-400 hover:text-slate-600 p-1"><i className="fa-solid fa-xmark"></i></button>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 pt-2">
                  <div className="bg-slate-50 p-3 rounded-2xl border border-slate-100 flex flex-col items-center">
                    <h4 className="font-bold text-slate-700 text-xs mb-3">Tỷ trọng Doanh thu</h4>
                    <div className="w-40 h-40">
                      <canvas ref={doughnutChartRef}></canvas>
                    </div>
                  </div>

                  <div className="bg-slate-50 p-3 rounded-2xl border border-slate-100 flex flex-col items-center">
                    <h4 className="font-bold text-slate-700 text-xs mb-3">Doanh thu theo chu kỳ (Triệu đ)</h4>
                    <div className="w-full h-40">
                      <canvas ref={barChartRef}></canvas>
                    </div>
                  </div>
                </div>

                <div className="text-right">
                  <button onClick={() => setShowReportModal(false)} className="px-5 py-2 bg-slate-800 text-white font-bold rounded-xl text-xs">
                    Đóng
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
