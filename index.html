<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VNPT - CRM Bán Hàng & Quản Lý Giao Dịch</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f3f4f6; }
    .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  </style>
</head>
<body class="text-slate-800 antialiased selection:bg-blue-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    const SUPABASE_URL = 'https://txcxftivmmgwakcxrnmu.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR4Y3hmdGl2bW1nd2FrY3hybm11Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyODIxNzUsImV4cCI6MjEwMTg1ODE3NX0.nCw8bgYSHE3Q49iGiqK6SuEjcYg5xs22Oa-2-EXqNnw';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function App() {
      const [activeNav, setActiveNav] = useState('dashboard');
      const [txs, setTxs] = useState([]);
      const [pkgs, setPkgs] = useState([]);
      const [bankLogs, setBankLogs] = useState([
        { id: 1, date: '07/08/2026', amount: 5000000, bank: 'MB Bank' },
        { id: 2, date: '05/08/2026', amount: 3500000, bank: 'Vietcombank' },
        { id: 3, date: '02/08/2026', amount: 4000000, bank: 'BIDV' }
      ]);
      const [loading, setLoading] = useState(false);
      const [showTxModal, setShowTxModal] = useState(false);

      const [txForm, setTxForm] = useState({
        type: 'Phát triển mới', service: 'SIM', packageName: '', months: 12, bonusMonths: 0, amount: '', customer: '', phone: '', startDate: new Date().toISOString().split('T')[0]
      });

      const barChartRef = useRef(null);
      const doughnutChartRef = useRef(null);
      const barChartInstance = useRef(null);
      const doughnutChartInstance = useRef(null);

      useEffect(() => {
        loadData();
      }, []);

      const loadData = async () => {
        setLoading(true);
        const { data: txsData } = await supabase.from('transactions').select('*').order('id', { ascending: false });
        if (txsData) setTxs(txsData);

        const { data: pkgsData } = await supabase.from('packages').select('*');
        if (pkgsData) setPkgs(pkgsData);
        setLoading(false);
      };

      // TÍNH TOÁN CÁC CON SỐ DỰA TRÊN DỮ LIỆU THỰC TẾ
      const stats = useMemo(() => {
        const simTxs = txs.filter(t => t.service === 'SIM');
        const fiberTxs = txs.filter(t => t.service === 'Fiber');
        const renewalTxs = txs.filter(t => t.type === 'Gia hạn');

        const totalRev = txs.reduce((sum, item) => sum + (Number(item.amount) || 0), 0);
        const simRev = simTxs.reduce((sum, item) => sum + (Number(item.amount) || 0), 0);
        const fiberRev = fiberTxs.reduce((sum, item) => sum + (Number(item.amount) || 0), 0);
        const renewalRev = renewalTxs.reduce((sum, item) => sum + (Number(item.amount) || 0), 0);

        const totalBankPaid = bankLogs.reduce((sum, item) => sum + item.amount, 0);
        const remaining = totalRev - totalBankPaid;

        return {
          totalRev,
          simCount: simTxs.length,
          simRev,
          fiberCount: fiberTxs.length,
          fiberRev,
          renewalCount: renewalTxs.length,
          renewalRev,
          totalBankPaid,
          remaining: remaining > 0 ? remaining : 0
        };
      }, [txs, bankLogs]);

      // MỤC TIÊU THÁNG 25M
      const targetRev = 25000000;
      const targetPercent = Math.min(Math.round((stats.totalRev / targetRev) * 100), 100);

      // KHÁCH SẮP ĐẾN HẠN DỰA TÊN DỮ LIỆU THỰC
      const upcomingExpirations = useMemo(() => {
        const today = new Date();
        return txs.map(t => {
          if (!t.expireDate) return null;
          const exp = new Date(t.expireDate);
          const diffDays = Math.ceil((exp - today) / (1000 * 60 * 60 * 24));
          return { ...t, diffDays };
        }).filter(t => t && t.diffDays >= 0)
          .sort((a, b) => a.diffDays - b.diffDays)
          .slice(0, 4);
      }, [txs]);

      // VẼ BIỂU ĐỒ ĐỘNG THEO DỮ LIỆU SUPABASE
      useEffect(() => {
        if (!txs.length) return;

        // Biểu đồ cột: Doanh thu theo ngày trong tháng
        if (barChartRef.current) {
          if (barChartInstance.current) barChartInstance.current.destroy();
          
          // Gom nhóm doanh thu theo ngày
          const daysMap = {};
          txs.forEach(t => {
            if (t.startDate) {
              const day = t.startDate.split('-')[2] || t.startDate.split('/')[0];
              const dayNum = parseInt(day, 10);
              daysMap[dayNum] = (daysMap[dayNum] || 0) + (Number(t.amount) || 0);
            }
          });

          const labels = Array.from({length: 31}, (_, i) => String(i + 1).padStart(2, '0'));
          const dataPoints = labels.map(day => (daysMap[parseInt(day, 10)] || 0) / 1000000);

          const ctx = barChartRef.current.getContext('2d');
          barChartInstance.current = new Chart(ctx, {
            type: 'bar',
            data: {
              labels: labels,
              datasets: [{
                data: dataPoints,
                backgroundColor: '#2563eb',
                borderRadius: 4,
                barThickness: 6
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { display: false } },
              scales: {
                y: { grid: { color: '#f1f5f9' }, ticks: { callback: v => v + 'M', font: { size: 9 } } },
                x: { grid: { display: false }, ticks: { font: { size: 9 } } }
              }
            }
          });
        }

        // Biểu đồ tròn: Doanh thu theo dịch vụ
        if (doughnutChartRef.current) {
          if (doughnutChartInstance.current) doughnutChartInstance.current.destroy();
          const ctx = doughnutChartRef.current.getContext('2d');
          doughnutChartInstance.current = new Chart(ctx, {
            type: 'doughnut',
            data: {
              labels: ['SIM mới', 'Fiber mới', 'Gia hạn'],
              datasets: [{
                data: [stats.simRev, stats.fiberRev, stats.renewalRev],
                backgroundColor: ['#2563eb', '#10b981', '#f59e0b'],
                borderWidth: 0
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              cutout: '70%',
              plugins: { legend: { display: false } }
            }
          });
        }
      }, [txs, stats]);

      const handleSelectPkg = (pkgId) => {
        const p = pkgs.find(item => item.id === Number(pkgId));
        if (p) {
          setTxForm({ ...txForm, packageName: p.name, service: p.service, amount: p.price, months: p.months, bonusMonths: p.bonusMonths });
        }
      };

      const handleSaveTx = async (e) => {
        e.preventDefault();
        const d = new Date(txForm.startDate);
        d.setMonth(d.getMonth() + Number(txForm.months) + Number(txForm.bonusMonths));
        const expireDate = d.toISOString().split('T')[0];

        const payload = {
          startDate: txForm.startDate,
          type: txForm.type,
          service: txForm.service,
          customer: txForm.customer,
          phone: txForm.phone,
          packageName: txForm.packageName,
          months: Number(txForm.months),
          bonusMonths: Number(txForm.bonusMonths),
          amount: Number(txForm.amount),
          expireDate: expireDate
        };

        const { data, error } = await supabase.from('transactions').insert([payload]).select();
        if (error) alert('Lỗi: ' + error.message);
        else if (data) {
          setTxs([data[0], ...txs]);
          setShowTxModal(false);
        }
      };

      return (
        <div className="flex min-h-screen bg-[#f3f4f6]">
          {/* SIDEBAR TRÁI */}
          <aside className="w-64 bg-white border-r border-slate-200 flex flex-col justify-between p-4 shrink-0">
            <div>
              <div className="flex items-center gap-3 px-2 mb-6">
                <div className="w-9 h-9 bg-blue-600 rounded-xl flex items-center justify-center text-white font-black text-sm shadow-md shadow-blue-500/30">
                  <i className="fa-solid fa-paper-plane"></i>
                </div>
                <div>
                  <h1 className="font-bold text-slate-900 text-sm leading-tight">CRM Bán hàng</h1>
                  <p className="text-[10px] text-slate-400 font-medium">Quản lý giao dịch</p>
                </div>
              </div>

              <nav className="space-y-1">
                <button onClick={() => setActiveNav('dashboard')} className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl font-bold text-xs transition ${activeNav === 'dashboard' ? 'bg-blue-600 text-white shadow-md shadow-blue-600/20' : 'text-slate-600 hover:bg-slate-100'}`}>
                  <i className="fa-solid fa-table-cells-large text-sm"></i> Dashboard
                </button>
                <button onClick={() => setActiveNav('txs')} className={`w-full flex items-center justify-between px-3 py-2.5 rounded-xl font-bold text-xs transition ${activeNav === 'txs' ? 'bg-blue-600 text-white shadow-md shadow-blue-600/20' : 'text-slate-600 hover:bg-slate-100'}`}>
                  <div className="flex items-center gap-3">
                    <i className="fa-solid fa-arrows-repeat text-sm"></i> Giao dịch
                  </div>
                  <span className="text-[9px] opacity-75 font-normal">Đồng bộ Cloud</span>
                </button>
              </nav>

              {/* CARD MỤC TIÊU THÁNG ĐỘNG */}
              <div className="mt-6 bg-gradient-to-br from-blue-50 to-blue-100/60 p-4 rounded-2xl border border-blue-100 space-y-3">
                <div className="flex justify-between items-center text-xs">
                  <span className="font-bold text-blue-900">Mục tiêu tháng 08/2026</span>
                </div>
                <div>
                  <div className="text-[10px] text-slate-500">Doanh thu chỉ tiêu</div>
                  <div className="text-base font-black text-blue-900">25.000.000 đ</div>
                  <div className="text-[10px] text-slate-500 mt-1">Đã đạt: <strong>{stats.totalRev.toLocaleString()} đ</strong></div>
                  <div className="w-full bg-slate-200 h-1.5 rounded-full mt-1.5 overflow-hidden">
                    <div className="bg-blue-600 h-full rounded-full transition-all duration-500" style={{width: `${targetPercent}%`}}></div>
                  </div>
                </div>

                <div className="space-y-2 pt-1 border-t border-blue-200/50 text-[11px]">
                  <div>
                    <div className="flex justify-between text-slate-600 mb-0.5"><span>SIM mới</span><span className="font-bold text-slate-800">{stats.simCount} / 50</span></div>
                    <div className="w-full bg-slate-200 h-1 rounded-full"><div className="bg-blue-600 h-full rounded-full" style={{width: `${Math.min((stats.simCount/50)*100, 100)}%`}}></div></div>
                  </div>
                  <div>
                    <div className="flex justify-between text-slate-600 mb-0.5"><span>Fiber mới</span><span className="font-bold text-slate-800">{stats.fiberCount} / 20</span></div>
                    <div className="w-full bg-slate-200 h-1 rounded-full"><div className="bg-blue-600 h-full rounded-full" style={{width: `${Math.min((stats.fiberCount/20)*100, 100)}%`}}></div></div>
                  </div>
                  <div>
                    <div className="flex justify-between text-slate-600 mb-0.5"><span>Gia hạn</span><span className="font-bold text-slate-800">{stats.renewalCount} / 40</span></div>
                    <div className="w-full bg-slate-200 h-1 rounded-full"><div className="bg-blue-600 h-full rounded-full" style={{width: `${Math.min((stats.renewalCount/40)*100, 100)}%`}}></div></div>
                  </div>
                </div>
              </div>
            </div>

            <div className="text-[10px] text-slate-400 border-t pt-3 space-y-0.5">
              <div>© 2026 VNPT - CRM Bán hàng</div>
              <div>Phiên bản 1.0.0 (Data Live)</div>
            </div>
          </aside>

          {/* NỘI DUNG CHÍNH */}
          <div className="flex-1 flex flex-col min-w-0">
            {/* HEADER */}
            <header className="bg-white border-b border-slate-200 px-6 py-3 flex items-center justify-between sticky top-0 z-10">
              <div className="flex items-center gap-4">
                <button className="text-slate-400 hover:text-slate-600"><i className="fa-solid fa-bars"></i></button>
                <h2 className="text-lg font-bold text-slate-800">Dashboard</h2>
              </div>

              <div className="flex items-center gap-4">
                {loading && <span className="text-[11px] font-bold text-blue-600 bg-blue-50 px-2.5 py-1 rounded-lg border border-blue-100"><i className="fa-solid fa-spin fa-spinner mr-1"></i> Đang tải dữ liệu...</span>}
                <div className="flex items-center gap-2 bg-slate-100 px-3 py-1.5 rounded-xl border border-slate-200 text-xs font-bold text-slate-700">
                  <span>Tháng 08/2026</span>
                  <i className="fa-regular fa-calendar text-slate-400"></i>
                </div>

                <div className="flex items-center gap-3">
                  <div className="flex items-center gap-2 pl-2 border-l">
                    <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=100&auto=format&fit=crop&q=80" className="w-8 h-8 rounded-full object-cover border" />
                    <div>
                      <div className="text-xs font-bold text-slate-800 leading-tight">Nguyễn Thị A</div>
                      <div className="text-[10px] text-slate-400">Nhân viên bán hàng</div>
                    </div>
                  </div>
                </div>
              </div>
            </header>

            {/* MAIN DASHBOARD */}
            <main className="p-6 space-y-5 overflow-y-auto custom-scrollbar">
              {/* 6 KHỐI KPI ĐỘNG */}
              <div className="grid grid-cols-6 gap-3">
                <div className="bg-white p-3.5 rounded-2xl border border-slate-200/80 shadow-sm flex items-start justify-between">
                  <div>
                    <span className="text-[10px] font-bold text-slate-400 block mb-1">Tổng doanh thu</span>
                    <span className="text-sm font-extrabold text-slate-900 block">{stats.totalRev.toLocaleString()} đ</span>
                    <span className="text-[9px] font-bold text-emerald-600 mt-1 inline-block"><i className="fa-solid fa-arrow-up"></i> {targetPercent}% <span className="text-slate-400 font-normal">chỉ tiêu</span></span>
                  </div>
                  <div className="w-8 h-8 bg-blue-600 text-white rounded-xl flex items-center justify-center text-sm"><i className="fa-solid fa-wallet"></i></div>
                </div>

                <div className="bg-white p-3.5 rounded-2xl border border-slate-200/80 shadow-sm flex items-start justify-between">
                  <div>
                    <span className="text-[10px] font-bold text-slate-400 block mb-1">SIM mới</span>
                    <span className="text-xs font-extrabold text-slate-900 block">{stats.simCount} thuê bao</span>
                    <span className="text-xs font-bold text-slate-700 mt-1 block">{stats.simRev.toLocaleString()} đ</span>
                  </div>
                  <div className="w-8 h-8 bg-emerald-500 text-white rounded-xl flex items-center justify-center text-sm"><i className="fa-solid fa-sim-card"></i></div>
                </div>

                <div className="bg-white p-3.5 rounded-2xl border border-slate-200/80 shadow-sm flex items-start justify-between">
                  <div>
                    <span className="text-[10px] font-bold text-slate-400 block mb-1">Fiber mới</span>
                    <span className="text-xs font-extrabold text-slate-900 block">{stats.fiberCount} hợp đồng</span>
                    <span className="text-xs font-bold text-slate-700 mt-1 block">{stats.fiberRev.toLocaleString()} đ</span>
                  </div>
                  <div className="w-8 h-8 bg-purple-500 text-white rounded-xl flex items-center justify-center text-sm"><i className="fa-solid fa-wifi"></i></div>
                </div>

                <div className="bg-white p-3.5 rounded-2xl border border-slate-200/80 shadow-sm flex items-start justify-between">
                  <div>
                    <span className="text-[10px] font-bold text-slate-400 block mb-1">Gia hạn</span>
                    <span className="text-xs font-extrabold text-slate-900 block">{stats.renewalCount} giao dịch</span>
                    <span className="text-xs font-bold text-slate-700 mt-1 block">{stats.renewalRev.toLocaleString()} đ</span>
                  </div>
                  <div className="w-8 h-8 bg-amber-500 text-white rounded-xl flex items-center justify-center text-sm"><i className="fa-solid fa-rotate-right"></i></div>
                </div>

                <div className="bg-white p-3.5 rounded-2xl border border-slate-200/80 shadow-sm flex items-start justify-between">
                  <div>
                    <span className="text-[10px] font-bold text-slate-400 block mb-1">Đã nộp ngân hàng</span>
                    <span className="text-xs font-extrabold text-slate-900 block">{stats.totalBankPaid.toLocaleString()} đ</span>
                    <span className="text-[9px] text-slate-400 mt-1 block">{bankLogs.length} lần nộp</span>
                  </div>
                  <div className="w-8 h-8 bg-teal-600 text-white rounded-xl flex items-center justify-center text-sm"><i className="fa-solid fa-building-columns"></i></div>
                </div>

                <div className="bg-white p-3.5 rounded-2xl border border-slate-200/80 shadow-sm flex items-start justify-between">
                  <div>
                    <span className="text-[10px] font-bold text-slate-400 block mb-1">Còn giữ</span>
                    <span className="text-xs font-extrabold text-rose-600 block">{stats.remaining.toLocaleString()} đ</span>
                  </div>
                  <div className="w-8 h-8 bg-rose-500 text-white rounded-xl flex items-center justify-center text-sm"><i className="fa-solid fa-money-bill-wave"></i></div>
                </div>
              </div>

              {/* KHỐI BIỂU ĐỒ & KHÁCH SẮP ĐẾN HẠN ĐỘNG */}
              <div className="grid grid-cols-12 gap-4">
                {/* BIỂU ĐỒ DOANH THU THEO NGÀY */}
                <div className="col-span-5 bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm space-y-3">
                  <div className="flex justify-between items-center">
                    <h3 className="font-bold text-xs text-slate-800">Doanh thu theo ngày</h3>
                    <span className="text-[10px] text-slate-400">Tự động tính từ Supabase</span>
                  </div>
                  <div className="h-44 w-full relative">
                    <canvas ref={barChartRef}></canvas>
                  </div>
                </div>

                {/* BIỂU ĐỒ DÒNG TRÒN DỊCH VỤ */}
                <div className="col-span-4 bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm space-y-3">
                  <h3 className="font-bold text-xs text-slate-800">Doanh thu theo loại dịch vụ</h3>
                  <div className="flex items-center gap-3">
                    <div className="w-32 h-36 relative flex items-center justify-center">
                      <canvas ref={doughnutChartRef}></canvas>
                      <div className="absolute inset-0 flex flex-col items-center justify-center text-center">
                        <span className="text-[9px] text-slate-400 font-bold">Tổng</span>
                        <span className="text-[10px] font-extrabold text-slate-800">{(stats.totalRev / 1000000).toFixed(1)}M</span>
                      </div>
                    </div>
                    <div className="space-y-2 text-[10px]">
                      <div>
                        <span className="inline-block w-2 h-2 rounded-full bg-blue-600 mr-1.5"></span>
                        <span className="font-bold text-slate-700">SIM mới</span>
                        <div className="text-slate-400 font-medium pl-3.5">{stats.simRev.toLocaleString()} đ</div>
                      </div>
                      <div>
                        <span className="inline-block w-2 h-2 rounded-full bg-emerald-500 mr-1.5"></span>
                        <span className="font-bold text-slate-700">Fiber mới</span>
                        <div className="text-slate-400 font-medium pl-3.5">{stats.fiberRev.toLocaleString()} đ</div>
                      </div>
                      <div>
                        <span className="inline-block w-2 h-2 rounded-full bg-amber-500 mr-1.5"></span>
                        <span className="font-bold text-slate-700">Gia hạn</span>
                        <div className="text-slate-400 font-medium pl-3.5">{stats.renewalRev.toLocaleString()} đ</div>
                      </div>
                    </div>
                  </div>
                </div>

                {/* KHÁCH SẮP ĐẾN HẠN ĐỘNG */}
                <div className="col-span-3 bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm space-y-3">
                  <div className="flex justify-between items-center">
                    <h3 className="font-bold text-xs text-slate-800">Khách sắp đến hạn</h3>
                    <span className="text-[10px] text-slate-400">Tự động tính</span>
                  </div>

                  <div className="space-y-2.5 text-xs">
                    {upcomingExpirations.length > 0 ? upcomingExpirations.map(item => (
                      <div key={item.id} className="flex items-center justify-between border-b pb-2">
                        <div className="flex items-center gap-2">
                          <div className="w-7 h-7 bg-slate-100 text-slate-600 font-bold rounded-full flex items-center justify-center text-[10px]">
                            {item.customer ? item.customer.charAt(0) : 'K'}
                          </div>
                          <div>
                            <div className="text-[11px] font-bold text-slate-800">{item.phone || 'N/A'}</div>
                            <div className="text-[9px] text-slate-400">{item.customer}</div>
                          </div>
                        </div>
                        <div className="text-right">
                          <span className="bg-blue-50 text-blue-600 text-[9px] font-bold px-1.5 py-0.5 rounded">{item.packageName}</span>
                          <div className="text-[9px] font-bold text-rose-500 mt-0.5">Còn {item.diffDays} ngày</div>
                        </div>
                      </div>
                    )) : (
                      <div className="text-[10px] text-slate-400 text-center py-4">Chưa có khách sắp hết hạn</div>
                    )}
                  </div>
                </div>
              </div>

              {/* BẢNG GIAO DỊCH VÀ LỊCH NỘP TIỀN ĐỘNG */}
              <div className="grid grid-cols-12 gap-4">
                <div className="col-span-8 bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm space-y-3">
                  <div className="flex justify-between items-center">
                    <h3 className="font-bold text-xs text-slate-800">Giao dịch mới nhất ({txs.length})</h3>
                  </div>

                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-[11px]">
                      <thead className="bg-slate-50 text-slate-400 font-bold border-b">
                        <tr>
                          <th className="p-2">Ngày giao dịch</th>
                          <th className="p-2">Loại GD</th>
                          <th className="p-2">Loại DV</th>
                          <th className="p-2">Khách hàng</th>
                          <th className="p-2">SĐT</th>
                          <th className="p-2">Gói cước</th>
                          <th className="p-2">Số tiền</th>
                          <th className="p-2">Hết hạn</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100 font-medium">
                        {txs.map(t => (
                          <tr key={t.id} className="hover:bg-slate-50">
                            <td className="p-2 font-bold">{t.startDate}</td>
                            <td className="p-2"><span className="text-[9px] font-bold bg-blue-50 text-blue-600 px-1.5 py-0.5 rounded">{t.type}</span></td>
                            <td className="p-2"><span className={`text-[9px] font-bold px-1.5 py-0.5 rounded ${t.service === 'SIM' ? 'bg-emerald-50 text-emerald-600' : 'bg-purple-50 text-purple-600'}`}>{t.service}</span></td>
                            <td className="p-2 font-bold text-slate-900">{t.customer}</td>
                            <td className="p-2">{t.phone}</td>
                            <td className="p-2 font-bold text-blue-600">{t.packageName}</td>
                            <td className="p-2 font-black">{(t.amount || 0).toLocaleString()} đ</td>
                            <td className="p-2 font-bold text-rose-500">{t.expireDate}</td>
                          </tr>
                        ))}
                        {txs.length === 0 && (
                          <tr><td colSpan="8" className="p-4 text-center text-slate-400">Chưa có giao dịch nào. Bấm nút bên dưới để thêm!</td></tr>
                        )}
                      </tbody>
                    </table>
                  </div>
                </div>

                {/* LỊCH NỘP TIỀN */}
                <div className="col-span-4 bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm space-y-3">
                  <div className="flex justify-between items-center">
                    <h3 className="font-bold text-xs text-slate-800">Lịch nộp tiền ngân hàng</h3>
                  </div>

                  <table className="w-full text-left text-[11px]">
                    <thead className="bg-slate-50 text-slate-400 font-bold border-b">
                      <tr>
                        <th className="p-2">Ngày nộp</th>
                        <th className="p-2">Số tiền</th>
                        <th className="p-2">Ngân hàng</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100 font-medium">
                      {bankLogs.map(item => (
                        <tr key={item.id}>
                          <td className="p-2">{item.date}</td>
                          <td className="p-2 font-bold text-slate-900">{item.amount.toLocaleString()} đ</td>
                          <td className="p-2 text-blue-600 font-bold">{item.bank}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>

              {/* 4 NÚT HÀNH ĐỘNG NHANH */}
              <div className="grid grid-cols-4 gap-4 pt-2">
                <button onClick={() => setShowTxModal(true)} className="bg-blue-600 hover:bg-blue-700 text-white p-3.5 rounded-2xl flex items-center justify-between shadow-md shadow-blue-500/20 transition text-left">
                  <div className="flex items-center gap-3">
                    <div className="w-8 h-8 bg-white/20 rounded-xl flex items-center justify-center font-bold text-base"><i className="fa-solid fa-plus"></i></div>
                    <div>
                      <div className="font-bold text-xs">Thêm giao dịch</div>
                      <div className="text-[9px] opacity-80">Cập nhật dữ liệu ngay</div>
                    </div>
                  </div>
                  <i className="fa-solid fa-chevron-right text-xs opacity-60"></i>
                </button>

                <button onClick={() => setShowTxModal(true)} className="bg-emerald-600 hover:bg-emerald-700 text-white p-3.5 rounded-2xl flex items-center justify-between shadow-md shadow-emerald-500/20 transition text-left">
                  <div className="flex items-center gap-3">
                    <div className="w-8 h-8 bg-white/20 rounded-xl flex items-center justify-center font-bold text-base"><i className="fa-solid fa-user-plus"></i></div>
                    <div>
                      <div className="font-bold text-xs">Thêm khách hàng</div>
                      <div className="text-[9px] opacity-80">Tự động thêm vào danh sách</div>
                    </div>
                  </div>
                  <i className="fa-solid fa-chevron-right text-xs opacity-60"></i>
                </button>

                <button className="bg-purple-600 hover:bg-purple-700 text-white p-3.5 rounded-2xl flex items-center justify-between shadow-md shadow-purple-500/20 transition text-left">
                  <div className="flex items-center gap-3">
                    <div className="w-8 h-8 bg-white/20 rounded-xl flex items-center justify-center font-bold text-base"><i className="fa-solid fa-wallet"></i></div>
                    <div>
                      <div className="font-bold text-xs">Nộp tiền ngân hàng</div>
                      <div className="text-[9px] opacity-80">Trừ vào tiền còn giữ</div>
                    </div>
                  </div>
                  <i className="fa-solid fa-chevron-right text-xs opacity-60"></i>
                </button>

                <button className="bg-amber-500 hover:bg-amber-600 text-white p-3.5 rounded-2xl flex items-center justify-between shadow-md shadow-amber-500/20 transition text-left">
                  <div className="flex items-center gap-3">
                    <div className="w-8 h-8 bg-white/20 rounded-xl flex items-center justify-center font-bold text-base"><i className="fa-solid fa-chart-pie"></i></div>
                    <div>
                      <div className="font-bold text-xs">Báo cáo doanh thu</div>
                      <div className="text-[9px] opacity-80">Kết xuất dữ liệu real-time</div>
                    </div>
                  </div>
                  <i className="fa-solid fa-chevron-right text-xs opacity-60"></i>
                </button>
              </div>
            </main>
          </div>

          {/* MODAL THÊM GIAO DỊCH */}
          {showTxModal && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-3xl w-full max-w-lg p-6 shadow-2xl space-y-4">
                <div className="flex justify-between items-center border-b pb-3">
                  <h3 className="text-sm font-black text-slate-900">➕ Thêm Giao Dịch Mới</h3>
                  <button onClick={() => setShowTxModal(false)} className="text-slate-400 font-bold text-lg hover:text-slate-600">✕</button>
                </div>
                <form onSubmit={handleSaveTx} className="space-y-3">
                  {pkgs.length > 0 && (
                    <div>
                      <label className="text-[10px] font-extrabold text-blue-700 tracking-wide uppercase">Chọn gói cước mẫu (Tự động điền giá)</label>
                      <select onChange={e => handleSelectPkg(e.target.value)} className="w-full mt-1 border-2 border-blue-200 rounded-xl p-2 text-xs font-bold bg-blue-50/50 outline-none">
                        <option value="">-- Chọn gói cước sẵn có --</option>
                        {pkgs.map(p => (
                          <option key={p.id} value={p.id}>[{p.service}] {p.name} - {(p.price || 0).toLocaleString()}đ ({p.months}T)</option>
                        ))}
                      </select>
                    </div>
                  )}
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-xs font-bold text-slate-600">Loại Giao Dịch</label>
                      <select value={txForm.type} onChange={e => setTxForm({...txForm, type: e.target.value})} className="w-full mt-1 border rounded-xl p-2 text-xs font-medium">
                        <option value="Phát triển mới">Phát triển mới</option>
                        <option value="Gia hạn">Gia hạn</option>
                      </select>
                    </div>
                    <div>
                      <label className="text-xs font-bold text-slate-600">Loại Dịch Vụ</label>
                      <select value={txForm.service} onChange={e => setTxForm({...txForm, service: e.target.value})} className="w-full mt-1 border rounded-xl p-2 text-xs font-medium">
                        <option value="SIM">SIM</option>
                        <option value="Fiber">Fiber (Internet)</option>
                      </select>
                    </div>
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-xs font-bold text-slate-600">Khách Hàng</label>
                      <input required type="text" placeholder="Nguyễn Văn A" value={txForm.customer} onChange={e => setTxForm({...txForm, customer: e.target.value})} className="w-full mt-1 border rounded-xl p-2 text-xs" />
                    </div>
                    <div>
                      <label className="text-xs font-bold text-slate-600">SĐT</label>
                      <input type="text" placeholder="0911721999" value={txForm.phone} onChange={e => setTxForm({...txForm, phone: e.target.value})} className="w-full mt-1 border rounded-xl p-2 text-xs" />
                    </div>
                  </div>
                  <div>
                    <label className="text-xs font-bold text-slate-600">Gói Cước</label>
                    <input required type="text" placeholder="FCLUB" value={txForm.packageName} onChange={e => setTxForm({...txForm, packageName: e.target.value})} className="w-full mt-1 border rounded-xl p-2 text-xs font-bold text-blue-600" />
                  </div>
                  <div className="grid grid-cols-3 gap-2">
                    <div>
                      <label className="text-xs font-bold text-slate-600">Tháng</label>
                      <input type="number" value={txForm.months} onChange={e => setTxForm({...txForm, months: e.target.value})} className="w-full mt-1 border rounded-xl p-2 text-xs" />
                    </div>
                    <div>
                      <label className="text-xs font-bold text-emerald-600">Tháng KM</label>
                      <input type="number" value={txForm.bonusMonths} onChange={e => setTxForm({...txForm, bonusMonths: e.target.value})} className="w-full mt-1 border rounded-xl p-2 text-xs" />
                    </div>
                    <div>
                      <label className="text-xs font-bold text-slate-600">Số Tiền (đ)</label>
                      <input required type="number" value={txForm.amount} onChange={e => setTxForm({...txForm, amount: e.target.value})} className="w-full mt-1 border rounded-xl p-2 text-xs font-bold" />
                    </div>
                  </div>
                  <button type="submit" className="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold shadow-lg text-xs mt-2 transition">LƯU GIAO DỊCH LÊN SUPABASE</button>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
