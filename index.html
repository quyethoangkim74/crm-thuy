<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VNPT - CRM Bán Hàng & Quản Lý Giao Dịch</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f3f4f6; }
    .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  </style>
</head>
<body class="text-slate-800 antialiased selection:bg-blue-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    const SUPABASE_URL = 'https://txcxftivmmgwakcxrnmu.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR4Y3hmdGl2bW1nd2FrY3hybm11Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyODIxNzUsImV4cCI6MjEwMTg1ODE3NX0.nCw8bgYSHE3Q49iGiqK6SuEjcYg5xs22Oa-2-EXqNnw';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // MÃ PIN ĐĂNG NHẬP (Thay đổi mã ở đây)
    const CORRECT_PIN = '1234';

    function App() {
      // KIỂM TRA MÃ PIN ĐÃ LƯU TRONG MÁY CHƯA
      const [isAuthenticated, setIsAuthenticated] = useState(() => {
        return localStorage.getItem('crm_authenticated') === 'true';
      });
      const [pinInput, setPinInput] = useState('');
      const [pinError, setPinError] = useState('');

      const [activeNav, setActiveNav] = useState('dashboard');
      const [txs, setTxs] = useState([]);
      const [pkgs, setPkgs] = useState([]);
      const [bankLogs, setBankLogs] = useState([]);
      const [loading, setLoading] = useState(false);
      
      // Control Modals
      const [showTxModal, setShowTxModal] = useState(false);
      const [showBankModal, setShowBankModal] = useState(false);
      const [showReportModal, setShowReportModal] = useState(false);

      // Forms
      const [txForm, setTxForm] = useState({
        type: 'Phát triển mới', service: 'SIM', packageName: '', months: 12, bonusMonths: 0, amount: '', customer: '', phone: '', startDate: new Date().toISOString().split('T')[0]
      });

      const [bankForm, setBankForm] = useState({
        amount: '', bank: 'MB Bank', date: new Date().toISOString().split('T')[0], note: ''
      });

      const barChartRef = useRef(null);
      const doughnutChartRef = useRef(null);
      const barChartInstance = useRef(null);
      const doughnutChartInstance = useRef(null);

      useEffect(() => {
        if (isAuthenticated) {
          loadData();
        }
      }, [isAuthenticated]);

      const loadData = async () => {
        setLoading(true);
        const { data: txsData } = await supabase.from('transactions').select('*').order('id', { ascending: false });
        if (txsData) setTxs(txsData);

        const { data: pkgsData } = await supabase.from('packages').select('*');
        if (pkgsData) setPkgs(pkgsData);

        const { data: bankData } = await supabase.from('bank_logs').select('*').order('id', { ascending: false });
        if (bankData) setBankLogs(bankData);

        setLoading(false);
      };

      // XỬ LÝ NHẬP MÃ PIN
      const handlePinSubmit = (e) => {
        e.preventDefault();
        if (pinInput === CORRECT_PIN) {
          localStorage.setItem('crm_authenticated', 'true');
          setIsAuthenticated(true);
          setPinError('');
        } else {
          setPinError('Mã PIN không đúng. Vui lòng thử lại!');
          setPinInput('');
        }
      };

      const handleLogout = () => {
        localStorage.removeItem('crm_authenticated');
        setIsAuthenticated(false);
      };

      // TÍNH TOÁN CÁC SỐ LIỆU ĐỘNG
      const stats = useMemo(() => {
        const simTxs = txs.filter(t => t.service === 'SIM');
        const fiberTxs = txs.filter(t => t.service === 'Fiber');
        const renewalTxs = txs.filter(t => t.type === 'Gia hạn');

        const totalRev = txs.reduce((sum, item) => sum + (Number(item.amount) || 0), 0);
        const simRev = simTxs.reduce((sum, item) => sum + (Number(item.amount) || 0), 0);
        const fiberRev = fiberTxs.reduce((sum, item) => sum + (Number(item.amount) || 0), 0);
        const renewalRev = renewalTxs.reduce((sum, item) => sum + (Number(item.amount) || 0), 0);

        const totalBankPaid = bankLogs.reduce((sum, item) => sum + (Number(item.amount) || 0), 0);
        const remaining = totalRev - totalBankPaid;

        return {
          totalRev,
          simCount: simTxs.length,
          simRev,
          fiberCount: fiberTxs.length,
          fiberRev,
          renewalCount: renewalTxs.length,
          renewalRev,
          totalBankPaid,
          remaining: remaining > 0 ? remaining : 0
        };
      }, [txs, bankLogs]);

      const targetRev = 25000000;
      const targetPercent = Math.min(Math.round((stats.totalRev / targetRev) * 100), 100);

      const upcomingExpirations = useMemo(() => {
        const today = new Date();
        return txs.map(t => {
          if (!t.expireDate) return null;
          const exp = new Date(t.expireDate);
          const diffDays = Math.ceil((exp - today) / (1000 * 60 * 60 * 24));
          return { ...t, diffDays };
        }).filter(t => t && t.diffDays >= 0)
          .sort((a, b) => a.diffDays - b.diffDays)
          .slice(0, 4);
      }, [txs]);

      // VẼ BIỂU ĐỒ
      useEffect(() => {
        if (!isAuthenticated) return;

        if (barChartRef.current) {
          if (barChartInstance.current) barChartInstance.current.destroy();
          
          const daysMap = {};
          txs.forEach(t => {
            if (t.startDate) {
              const parts = t.startDate.split('-');
              const dayNum = parseInt(parts[2] || parts[0], 10);
              daysMap[dayNum] = (daysMap[dayNum] || 0) + (Number(t.amount) || 0);
            }
          });

          const labels = ['01', '04', '07', '10', '13', '16', '19', '22', '25', '28', '31'];
          const dataPoints = labels.map(day => ((daysMap[parseInt(day, 10)] || 0) / 1000000));

          const ctx = barChartRef.current.getContext('2d');
          barChartInstance.current = new Chart(ctx, {
            type: 'bar',
            data: {
              labels: labels,
              datasets: [{
                data: dataPoints,
                backgroundColor: '#2563eb',
                borderRadius: 4,
                barThickness: 10
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { display: false } },
              scales: {
                y: { grid: { color: '#f1f5f9' }, ticks: { callback: v => v + 'M', font: { size: 9 } } },
                x: { grid: { display: false }, ticks: { font: { size: 9 } } }
              }
            }
          });
        }

        if (doughnutChartRef.current) {
          if (doughnutChartInstance.current) doughnutChartInstance.current.destroy();
          const ctx = doughnutChartRef.current.getContext('2d');
          doughnutChartInstance.current = new Chart(ctx, {
            type: 'doughnut',
            data: {
              labels: ['SIM mới', 'Fiber mới', 'Gia hạn'],
              datasets: [{
                data: [stats.simRev || 1, stats.fiberRev || 1, stats.renewalRev || 1],
                backgroundColor: ['#2563eb', '#10b981', '#f59e0b'],
                borderWidth: 0
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              cutout: '70%',
              plugins: { legend: { display: false } }
            }
          });
        }
      }, [isAuthenticated, txs, stats]);

      // TẠO GIAO DỊCH MỚI
      const handleSaveTx = async (e) => {
        e.preventDefault();
        const d = new Date(txForm.startDate);
        d.setMonth(d.getMonth() + Number(txForm.months) + Number(txForm.bonusMonths));
        const expireDate = d.toISOString().split('T')[0];

        const payload = {
          startDate: txForm.startDate,
          type: txForm.type,
          service: txForm.service,
          customer: txForm.customer,
          phone: txForm.phone,
          packageName: txForm.packageName,
          months: Number(txForm.months),
          bonusMonths: Number(txForm.bonusMonths),
          amount: Number(txForm.amount),
          expireDate: expireDate
        };

        const { data, error } = await supabase.from('transactions').insert([payload]).select();
        if (error) alert('Lỗi: ' + error.message);
        else if (data) {
          setTxs([data[0], ...txs]);
          setShowTxModal(false);
        }
      };

      // NỘP TIỀN NGÂN HÀNG
      const handleSaveBank = async (e) => {
        e.preventDefault();
        const payload = {
          date: bankForm.date,
          amount: Number(bankForm.amount),
          bank: bankForm.bank,
          note: bankForm.note
        };

        const { data, error } = await supabase.from('bank_logs').insert([payload]).select();
        if (error) {
          alert('Lỗi nộp tiền: ' + error.message);
        } else if (data) {
          setBankLogs([data[0], ...bankLogs]);
          setShowBankModal(false);
          setBankForm({ amount: '', bank: 'MB Bank', date: new Date().toISOString().split('T')[0], note: '' });
        }
      };

      // NẾU CHƯA NHẬP MÃ PIN: HIỂN THỊ MÀN HÌNH MÃ PIN
      if (!isAuthenticated) {
        return (
          <div className="min-h-screen bg-slate-900 flex items-center justify-center p-4">
            <div className="bg-white rounded-3xl p-8 max-w-sm w-full shadow-2xl space-y-6 text-center">
              <div className="w-16 h-16 bg-blue-600 rounded-2xl flex items-center justify-center text-white text-2xl mx-auto shadow-lg shadow-blue-500/30">
                <i className="fa-solid fa-lock"></i>
              </div>
              <div>
                <h2 className="text-xl font-bold text-slate-900">VNPT CRM</h2>
                <p className="text-xs text-slate-500 mt-1">Nhập mã PIN để truy cập ứng dụng</p>
              </div>

              <form onSubmit={handlePinSubmit} className="space-y-4">
                <input
                  type="password"
                  maxLength="6"
                  placeholder="• • • •"
                  value={pinInput}
                  onChange={(e) => setPinInput(e.target.value)}
                  className="w-full text-center text-2xl font-black tracking-widest py-3 border-2 border-slate-200 rounded-2xl focus:border-blue-600 outline-none transition"
                  autoFocus
                />
                {pinError && <p className="text-xs font-bold text-rose-500">{pinError}</p>}
                <button
                  type="submit"
                  className="w-full py-3.5 bg-blue-600 hover:bg-blue-700 text-white rounded-2xl font-bold text-sm shadow-lg shadow-blue-600/30 transition"
                >
                  XÁC NHẬN MÃ PIN
                </button>
              </form>
            </div>
          </div>
        );
      }

      // NẾU ĐÃ NHẬP ĐÚNG PIN: Hiển thị ứng dụng CRM
      return (
        <div className="flex min-h-screen bg-[#f3f4f6]">
          {/* SIDEBAR TRÁI */}
          <aside className="w-64 bg-white border-r border-slate-200 flex flex-col justify-between p-4 shrink-0">
            <div>
              <div className="flex items-center gap-3 px-2 mb-6">
                <div className="w-9 h-9 bg-blue-600 rounded-xl flex items-center justify-center text-white font-black text-sm shadow-md shadow-blue-500/30">
                  <i className="fa-solid fa-paper-plane"></i>
                </div>
                <div>
                  <h1 className="font-bold text-slate-900 text-sm leading-tight">CRM Bán hàng</h1>
                  <p className="text-[10px] text-slate-400 font-medium">VNPT Telecom</p>
                </div>
              </div>

              <nav className="space-y-1">
                <button onClick={() => setActiveNav('dashboard')} className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl font-bold text-xs transition ${activeNav === 'dashboard' ? 'bg-blue-600 text-white shadow-md shadow-blue-600/20' : 'text-slate-600 hover:bg-slate-100'}`}>
                  <i className="fa-solid fa-table-cells-large text-sm"></i> Dashboard
                </button>
                <button onClick={() => setActiveNav('txs')} className={`w-full flex items-center justify-between px-3 py-2.5 rounded-xl font-bold text-xs transition ${activeNav === 'txs' ? 'bg-blue-600 text-white shadow-md shadow-blue-600/20' : 'text-slate-600 hover:bg-slate-100'}`}>
                  <div className="flex items-center gap-3">
                    <i className="fa-solid fa-arrows-repeat text-sm"></i> Giao dịch
                  </div>
                  <span className="text-[9px] opacity-75 font-normal">Cloud</span>
                </button>
              </nav>

              {/* MỤC TIÊU THÁNG */}
              <div className="mt-6 bg-gradient-to-br from-blue-50 to-blue-100/60 p-4 rounded-2xl border border-blue-100 space-y-3">
                <div className="flex justify-between items-center text-xs">
                  <span className="font-bold text-blue-900">Mục tiêu tháng 08/2026</span>
                </div>
                <div>
                  <div className="text-[10px] text-slate-500">Doanh thu chỉ tiêu</div>
                  <div className="text-base font-black text-blue-900">25.000.000 đ</div>
                  <div className="text-[10px] text-slate-500 mt-1">Đã đạt: <strong>{stats.totalRev.toLocaleString()} đ</strong></div>
                  <div className="w-full bg-slate-200 h-1.5 rounded-full mt-1.5 overflow-hidden">
                    <div className="bg-blue-600 h-full rounded-full transition-all duration-500" style={{width: `${targetPercent}%`}}></div>
                  </div>
                </div>

                <div className="space-y-2 pt-1 border-t border-blue-200/50 text-[11px]">
                  <div>
                    <div className="flex justify-between text-slate-600 mb-0.5"><span>SIM mới</span><span className="font-bold text-slate-800">{stats.simCount} / 50</span></div>
                    <div className="w-full bg-slate-200 h-1 rounded-full"><div className="bg-blue-600 h-full rounded-full" style={{width: `${Math.min((stats.simCount/50)*100, 100)}%`}}></div></div>
                  </div>
                  <div>
                    <div className="flex justify-between text-slate-600 mb-0.5"><span>Fiber mới</span><span className="font-bold text-slate-800">{stats.fiberCount} / 20</span></div>
                    <div className="w-full bg-slate-200 h-1 rounded-full"><div className="bg-blue-600 h-full rounded-full" style={{width: `${Math.min((stats.fiberCount/20)*100, 100)}%`}}></div></div>
                  </div>
                  <div>
                    <div className="flex justify-between text-slate-600 mb-0.5"><span>Gia hạn</span><span className="font-bold text-slate-800">{stats.renewalCount} / 40</span></div>
                    <div className="w-full bg-slate-200 h-1 rounded-full"><div className="bg-blue-600 h-full rounded-full" style={{width: `${Math.min((stats.renewalCount/40)*100, 100)}%`}}></div></div>
                  </div>
                </div>
              </div>
            </div>

            <div className="space-y-2 border-t pt-3">
              <button onClick={handleLogout} className="w-full text-left text-xs font-bold text-rose-600 hover:bg-rose-50 p-2 rounded-xl transition flex items-center gap-2">
                <i className="fa-solid fa-right-from-bracket"></i> Khóa ứng dụng
              </button>
              <div className="text-[10px] text-slate-400">© 2026 VNPT - CRM Bán hàng</div>
            </div>
          </aside>

          {/* MAIN CONTENT */}
          <div className="flex-1 flex flex-col min-w-0">
            <header className="bg-white border-b border-slate-200 px-6 py-3 flex items-center justify-between sticky top-0 z-10">
              <div className="flex items-center gap-4">
                <h2 className="text-lg font-bold text-slate-800">Dashboard Quản Lý</h2>
              </div>
              <div className="flex items-center gap-4">
                {loading && <span className="text-[11px] font-bold text-blue-600 bg-blue-50 px-2.5 py-1 rounded-lg"><i className="fa-solid fa-spin fa-spinner mr-1"></i> Đang tải dữ liệu...</span>}
                <div className="flex items-center gap-2 bg-slate-100 px-3 py-1.5 rounded-xl border border-slate-200 text-xs font-bold text-slate-700">
                  <span>Tháng 08/2026</span>
                  <i className="fa-regular fa-calendar text-slate-400"></i>
                </div>
              </div>
            </header>

            <main className="p-6 space-y-5 overflow-y-auto custom-scrollbar">
              {/* 6 KHỐI THỐNG KÊ */}
              <div className="grid grid-cols-6 gap-3">
                <div className="bg-white p-3.5 rounded-2xl border border-slate-200/80 shadow-sm flex items-start justify-between">
                  <div>
                    <span className="text-[10px] font-bold text-slate-400 block mb-1">Tổng doanh thu</span>
                    <span className="text-sm font-extrabold text-slate-900 block">{stats.totalRev.toLocaleString()} đ</span>
                    <span className="text-[9px] font-bold text-emerald-600 mt-1 inline-block"><i className="fa-solid fa-arrow-up"></i> {targetPercent}% <span className="text-slate-400 font-normal">chỉ tiêu</span></span>
                  </div>
                  <div className="w-8 h-8 bg-blue-600 text-white rounded-xl flex items-center justify-center text-sm"><i className="fa-solid fa-wallet"></i></div>
                </div>

                <div className="bg-white p-3.5 rounded-2xl border border-slate-200/80 shadow-sm flex items-start justify-between">
                  <div>
                    <span className="text-[10px] font-bold text-slate-400 block mb-1">SIM mới</span>
                    <span className="text-xs font-extrabold text-slate-900 block">{stats.simCount} thuê bao</span>
                    <span className="text-xs font-bold text-slate-700 mt-1 block">{stats.simRev.toLocaleString()} đ</span>
                  </div>
                  <div className="w-8 h-8 bg-emerald-500 text-white rounded-xl flex items-center justify-center text-sm"><i className="fa-solid fa-sim-card"></i></div>
                </div>

                <div className="bg-white p-3.5 rounded-2xl border border-slate-200/80 shadow-sm flex items-start justify-between">
                  <div>
                    <span className="text-[10px] font-bold text-slate-400 block mb-1">Fiber mới</span>
                    <span className="text-xs font-extrabold text-slate-900 block">{stats.fiberCount} hợp đồng</span>
                    <span className="text-xs font-bold text-slate-700 mt-1 block">{stats.fiberRev.toLocaleString()} đ</span>
                  </div>
                  <div className="w-8 h-8 bg-purple-500 text-white rounded-xl flex items-center justify-center text-sm"><i className="fa-solid fa-wifi"></i></div>
                </div>

                <div className="bg-white p-3.5 rounded-2xl border border-slate-200/80 shadow-sm flex items-start justify-between">
                  <div>
                    <span className="text-[10px] font-bold text-slate-400 block mb-1">Gia hạn</span>
                    <span className="text-xs font-extrabold text-slate-900 block">{stats.renewalCount} giao dịch</span>
                    <span className="text-xs font-bold text-slate-700 mt-1 block">{stats.renewalRev.toLocaleString()} đ</span>
                  </div>
                  <div className="w-8 h-8 bg-amber-500 text-white rounded-xl flex items-center justify-center text-sm"><i className="fa-solid fa-rotate-right"></i></div>
                </div>

                <div className="bg-white p-3.5 rounded-2xl border border-slate-200/80 shadow-sm flex items-start justify-between">
                  <div>
                    <span className="text-[10px] font-bold text-slate-400 block mb-1">Đã nộp ngân hàng</span>
                    <span className="text-xs font-extrabold text-slate-900 block">{stats.totalBankPaid.toLocaleString()} đ</span>
                    <span className="text-[9px] text-slate-400 mt-1 block">{bankLogs.length} lần nộp</span>
                  </div>
                  <div className="w-8 h-8 bg-teal-600 text-white rounded-xl flex items-center justify-center text-sm"><i className="fa-solid fa-building-columns"></i></div>
                </div>

                <div className="bg-white p-3.5 rounded-2xl border border-slate-200/80 shadow-sm flex items-start justify-between">
                  <div>
                    <span className="text-[10px] font-bold text-slate-400 block mb-1">Còn giữ (Chưa nộp)</span>
                    <span className="text-xs font-extrabold text-rose-600 block">{stats.remaining.toLocaleString()} đ</span>
                  </div>
                  <div className="w-8 h-8 bg-rose-500 text-white rounded-xl flex items-center justify-center text-sm"><i className="fa-solid fa-money-bill-wave"></i></div>
                </div>
              </div>

              {/* BIỂU ĐỒ & KHÁCH SẮP ĐẾN HẠN */}
              <div className="grid grid-cols-12 gap-4">
                <div className="col-span-5 bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm space-y-3">
                  <h3 className="font-bold text-xs text-slate-800">Doanh thu theo ngày</h3>
                  <div className="h-44 w-full relative"><canvas ref={barChartRef}></canvas></div>
                </div>

                <div className="col-span-4 bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm space-y-3">
                  <h3 className="font-bold text-xs text-slate-800">Tỷ lệ dịch vụ</h3>
                  <div className="flex items-center gap-3">
                    <div className="w-32 h-36 relative flex items-center justify-center">
                      <canvas ref={doughnutChartRef}></canvas>
                    </div>
                    <div className="space-y-2 text-[10px]">
                      <div><span className="inline-block w-2 h-2 rounded-full bg-blue-600 mr-1.5"></span><span className="font-bold">SIM:</span> {stats.simRev.toLocaleString()}đ</div>
                      <div><span className="inline-block w-2 h-2 rounded-full bg-emerald-500 mr-1.5"></span><span className="font-bold">Fiber:</span> {stats.fiberRev.toLocaleString()}đ</div>
                      <div><span className="inline-block w-2 h-2 rounded-full bg-amber-500 mr-1.5"></span><span className="font-bold">Gia hạn:</span> {stats.renewalRev.toLocaleString()}đ</div>
                    </div>
                  </div>
                </div>

                <div className="col-span-3 bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm space-y-3">
                  <h3 className="font-bold text-xs text-slate-800">Khách sắp đến hạn</h3>
                  <div className="space-y-2 text-xs">
                    {upcomingExpirations.map(item => (
                      <div key={item.id} className="flex items-center justify-between border-b pb-1">
                        <div>
                          <div className="text-[11px] font-bold text-slate-800">{item.customer}</div>
                          <div className="text-[9px] text-slate-400">{item.phone}</div>
                        </div>
                        <span className="text-[9px] font-bold text-rose-500">Còn {item.diffDays} ngày</span>
                      </div>
                    ))}
                  </div>
                </div>
              </div>

              {/* BẢNG GIAO DỊCH VÀ LỊCH NỘP TIỀN */}
              <div className="grid grid-cols-12 gap-4">
                <div className="col-span-8 bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm space-y-3">
                  <h3 className="font-bold text-xs text-slate-800">Giao dịch gần đây ({txs.length})</h3>
                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-[11px]">
                      <thead className="bg-slate-50 text-slate-400 border-b">
                        <tr>
                          <th className="p-2">Ngày GD</th>
                          <th className="p-2">Khách hàng</th>
                          <th className="p-2">SĐT</th>
                          <th className="p-2">Gói cước</th>
                          <th className="p-2">Số tiền</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100 font-medium">
                        {txs.slice(0, 5).map(t => (
                          <tr key={t.id}>
                            <td className="p-2">{t.startDate}</td>
                            <td className="p-2 font-bold">{t.customer}</td>
                            <td className="p-2">{t.phone}</td>
                            <td className="p-2 text-blue-600 font-bold">{t.packageName}</td>
                            <td className="p-2 font-black">{(t.amount || 0).toLocaleString()} đ</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>

                <div className="col-span-4 bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm space-y-3">
                  <h3 className="font-bold text-xs text-slate-800">Lịch sử nộp tiền ngân hàng</h3>
                  <table className="w-full text-left text-[11px]">
                    <thead className="bg-slate-50 text-slate-400 border-b">
                      <tr>
                        <th className="p-2">Ngày nộp</th>
                        <th className="p-2">Số tiền</th>
                        <th className="p-2">Ngân hàng</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100 font-medium">
                      {bankLogs.map(item => (
                        <tr key={item.id}>
                          <td className="p-2">{item.date}</td>
                          <td className="p-2 font-bold text-emerald-600">{item.amount.toLocaleString()} đ</td>
                          <td className="p-2 text-slate-700 font-bold">{item.bank}</td>
                        </tr>
                      ))}
                      {bankLogs.length === 0 && (
                        <tr><td colSpan="3" className="p-3 text-center text-slate-400">Chưa nộp tiền lần nào</td></tr>
                      )}
                    </tbody>
                  </table>
                </div>
              </div>

              {/* 4 NÚT HÀNH ĐỘNG NHANH */}
              <div className="grid grid-cols-4 gap-4 pt-2">
                <button onClick={() => setShowTxModal(true)} className="bg-blue-600 hover:bg-blue-700 text-white p-3.5 rounded-2xl flex items-center justify-between shadow-md transition">
                  <div className="flex items-center gap-3">
                    <div className="w-8 h-8 bg-white/20 rounded-xl flex items-center justify-center font-bold"><i className="fa-solid fa-plus"></i></div>
                    <div className="text-left">
                      <div className="font-bold text-xs">Thêm giao dịch</div>
                      <div className="text-[9px] opacity-80">Lưu vào cơ sở dữ liệu</div>
                    </div>
                  </div>
                </button>

                <button onClick={() => setShowTxModal(true)} className="bg-emerald-600 hover:bg-emerald-700 text-white p-3.5 rounded-2xl flex items-center justify-between shadow-md transition">
                  <div className="flex items-center gap-3">
                    <div className="w-8 h-8 bg-white/20 rounded-xl flex items-center justify-center font-bold"><i className="fa-solid fa-user-plus"></i></div>
                    <div className="text-left">
                      <div className="font-bold text-xs">Thêm khách hàng</div>
                      <div className="text-[9px] opacity-80">Cập nhật danh sách</div>
                    </div>
                  </div>
                </button>

                <button onClick={() => setShowBankModal(true)} className="bg-purple-600 hover:bg-purple-700 text-white p-3.5 rounded-2xl flex items-center justify-between shadow-md transition">
                  <div className="flex items-center gap-3">
                    <div className="w-8 h-8 bg-white/20 rounded-xl flex items-center justify-center font-bold"><i className="fa-solid fa-wallet"></i></div>
                    <div className="text-left">
                      <div className="font-bold text-xs">Nộp tiền ngân hàng</div>
                      <div className="text-[9px] opacity-80">Cập nhật số dư giữ</div>
                    </div>
                  </div>
                </button>

                <button onClick={() => setShowReportModal(true)} className="bg-amber-500 hover:bg-amber-600 text-white p-3.5 rounded-2xl flex items-center justify-between shadow-md transition">
                  <div className="flex items-center gap-3">
                    <div className="w-8 h-8 bg-white/20 rounded-xl flex items-center justify-center font-bold"><i className="fa-solid fa-chart-pie"></i></div>
                    <div className="text-left">
                      <div className="font-bold text-xs">Báo cáo doanh thu</div>
                      <div className="text-[9px] opacity-80">Xem tổng hợp chi tiết</div>
                    </div>
                  </div>
                </button>
              </div>
            </main>
          </div>

          {/* MODAL NỘP TIỀN NGÂN HÀNG */}
          {showBankModal && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-3xl w-full max-w-md p-6 shadow-2xl space-y-4">
                <div className="flex justify-between items-center border-b pb-3">
                  <h3 className="text-sm font-black text-slate-900"><i className="fa-solid fa-building-columns text-purple-600 mr-2"></i>Nộp Tiền Vào Ngân Hàng</h3>
                  <button onClick={() => setShowBankModal(false)} className="text-slate-400 font-bold hover:text-slate-600">✕</button>
                </div>
                <form onSubmit={handleSaveBank} className="space-y-3">
                  <div>
                    <label className="text-xs font-bold text-slate-600">Số Tiền Nộp (đ)</label>
                    <input required type="number" placeholder="5000000" value={bankForm.amount} onChange={e => setBankForm({...bankForm, amount: e.target.value})} className="w-full mt-1 border rounded-xl p-2.5 text-sm font-extrabold text-purple-700 outline-none border-purple-200 focus:border-purple-600" />
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-xs font-bold text-slate-600">Ngân Hàng</label>
                      <select value={bankForm.bank} onChange={e => setBankForm({...bankForm, bank: e.target.value})} className="w-full mt-1 border rounded-xl p-2 text-xs font-medium">
                        <option value="MB Bank">MB Bank</option>
                        <option value="Vietcombank">Vietcombank</option>
                        <option value="BIDV">BIDV</option>
                        <option value="Agribank">Agribank</option>
                        <option value="Vietinbank">Vietinbank</option>
                      </select>
                    </div>
                    <div>
                      <label className="text-xs font-bold text-slate-600">Ngày Nộp</label>
                      <input type="date" value={bankForm.date} onChange={e => setBankForm({...bankForm, date: e.target.value})} className="w-full mt-1 border rounded-xl p-2 text-xs" />
                    </div>
                  </div>
                  <div>
                    <label className="text-xs font-bold text-slate-600">Ghi Chú</label>
                    <input type="text" placeholder="Nộp doanh thu tuần 1" value={bankForm.note} onChange={e => setBankForm({...bankForm, note: e.target.value})} className="w-full mt-1 border rounded-xl p-2 text-xs" />
                  </div>
                  <button type="submit" className="w-full py-3 bg-purple-600 hover:bg-purple-700 text-white rounded-xl font-bold shadow-lg text-xs transition">XÁC NHẬN NỘP TIỀN</button>
                </form>
              </div>
            </div>
          )}

          {/* MODAL BÁO CÁO DOANH THU */}
          {showReportModal && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-3xl w-full max-w-xl p-6 shadow-2xl space-y-4">
                <div className="flex justify-between items-center border-b pb-3">
                  <h3 className="text-sm font-black text-slate-900"><i className="fa-solid fa-chart-pie text-amber-500 mr-2"></i> Báo Cáo Doanh Thu Chi Tiết</h3>
                  <button onClick={() => setShowReportModal(false)} className="text-slate-400 font-bold hover:text-slate-600">✕</button>
                </div>
                
                <div className="grid grid-cols-2 gap-3 text-xs">
                  <div className="p-3 bg-slate-50 rounded-xl border">
                    <span className="text-slate-500 block">Tổng doanh thu hệ thống</span>
                    <span className="text-base font-black text-blue-600">{stats.totalRev.toLocaleString()} đ</span>
                  </div>
                  <div className="p-3 bg-slate-50 rounded-xl border">
                    <span className="text-slate-500 block">Tổng đã nộp ngân hàng</span>
                    <span className="text-base font-black text-emerald-600">{stats.totalBankPaid.toLocaleString()} đ</span>
                  </div>
                </div>

                <div className="space-y-2 text-xs">
                  <div className="font-bold text-slate-700">Chi tiết theo loại dịch vụ:</div>
                  <div className="flex justify-between p-2.5 bg-blue-50/50 rounded-xl border border-blue-100">
                    <span>📱 Dịch vụ SIM ({stats.simCount} GD)</span>
                    <span className="font-bold">{stats.simRev.toLocaleString()} đ</span>
                  </div>
                  <div className="flex justify-between p-2.5 bg-emerald-50/50 rounded-xl border border-emerald-100">
                    <span>🌐 Dịch vụ Fiber ({stats.fiberCount} GD)</span>
                    <span className="font-bold">{stats.fiberRev.toLocaleString()} đ</span>
                  </div>
                  <div className="flex justify-between p-2.5 bg-amber-50/50 rounded-xl border border-amber-100">
                    <span>🔄 Dịch vụ Gia Hạn ({stats.renewalCount} GD)</span>
                    <span className="font-bold">{stats.renewalRev.toLocaleString()} đ</span>
                  </div>
                </div>

                <div className="p-3 bg-rose-50 border border-rose-100 rounded-xl flex justify-between items-center text-xs">
                  <span className="font-bold text-rose-800">Số tiền hiện còn giữ lại:</span>
                  <span className="text-sm font-black text-rose-600">{stats.remaining.toLocaleString()} đ</span>
                </div>

                <button onClick={() => setShowReportModal(false)} className="w-full py-2.5 bg-slate-800 hover:bg-slate-900 text-white rounded-xl font-bold text-xs">ĐÓNG BÁO CÁO</button>
              </div>
            </div>
          )}

          {/* MODAL THÊM GIAO DỊCH */}
          {showTxModal && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-3xl w-full max-w-lg p-6 shadow-2xl space-y-4">
                <div className="flex justify-between items-center border-b pb-3">
                  <h3 className="text-sm font-black text-slate-900">➕ Thêm Giao Dịch Mới</h3>
                  <button onClick={() => setShowTxModal(false)} className="text-slate-400 font-bold hover:text-slate-600">✕</button>
                </div>
                <form onSubmit={handleSaveTx} className="space-y-3">
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-xs font-bold text-slate-600">Khách Hàng</label>
                      <input required type="text" placeholder="Nguyễn Văn A" value={txForm.customer} onChange={e => setTxForm({...txForm, customer: e.target.value})} className="w-full mt-1 border rounded-xl p-2 text-xs" />
                    </div>
                    <div>
                      <label className="text-xs font-bold text-slate-600">SĐT</label>
                      <input type="text" placeholder="0911721999" value={txForm.phone} onChange={e => setTxForm({...txForm, phone: e.target.value})} className="w-full mt-1 border rounded-xl p-2 text-xs" />
                    </div>
                  </div>
                  <div>
                    <label className="text-xs font-bold text-slate-600">Gói Cước</label>
                    <input required type="text" placeholder="FCLUB" value={txForm.packageName} onChange={e => setTxForm({...txForm, packageName: e.target.value})} className="w-full mt-1 border rounded-xl p-2 text-xs font-bold text-blue-600" />
                  </div>
                  <div className="grid grid-cols-3 gap-2">
                    <div>
                      <label className="text-xs font-bold text-slate-600">Tháng</label>
                      <input type="number" value={txForm.months} onChange={e => setTxForm({...txForm, months: e.target.value})} className="w-full mt-1 border rounded-xl p-2 text-xs" />
                    </div>
                    <div>
                      <label className="text-xs font-bold text-emerald-600">Tháng KM</label>
                      <input type="number" value={txForm.bonusMonths} onChange={e => setTxForm({...txForm, bonusMonths: e.target.value})} className="w-full mt-1 border rounded-xl p-2 text-xs" />
                    </div>
                    <div>
                      <label className="text-xs font-bold text-slate-600">Số Tiền (đ)</label>
                      <input required type="number" value={txForm.amount} onChange={e => setTxForm({...txForm, amount: e.target.value})} className="w-full mt-1 border rounded-xl p-2 text-xs font-bold" />
                    </div>
                  </div>
                  <button type="submit" className="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold shadow-lg text-xs mt-2 transition">LƯU GIAO DỊCH LÊN SUPABASE</button>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
